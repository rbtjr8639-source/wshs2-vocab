ng assessments referred to as 360-degree evaluations.", "이 딜레마를 없애기 위해 점점 더 많은 조직이 360도 평가라고 불리는 평가를 시행하고 있다.", "2022-평가원-6월", ""], ["It may be easier to reach an agreement when settlement terms don't have to be implemented until months in the future.", "합의 조건을 몇 달 후에야 이행해도 될 때 합의에 이르기가 더 쉬울 수 있다.", "2023-수능", ""]]}, {"w": "egalitarian", "ipa": "iˌɡælɪˈteriən", "m": "ⓐ 평등주의의, 인류 평등주의의", "d": [["ⓐ", "believing that all people are equal and should have the same rights and opportunities", "모든 사람이 평등하며 같은 권리와 기회를 가져야 한다고 믿는"]], "et": "프랑스어 égal (평등한) + -itarian (주의의)", "ex": "평등을 주장하는", "g": [["유의어", "equal (평등한), fair (공정한), democratic (민주적인)"], ["반의어", "hierarchical (위계적인)"], ["파생어", "equality ⓝ (평등)"]], "c": ["egalitarian programs[society] (평등주의적 프로그램[사회])"], "s": [["Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.", "자유주의 문화 같은 일부 문화는 공정한 기회 균등을 추구하면서 가족의 역할에 점점 더 많은 제한을 가하고, 교육, 의료, 그리고 사회의 다른 적극적 권리를 위한 더 평등주의적인 정부 프로그램을 시행하는 것을 택할 수도 있다.", "본문", ""]]}, {"w": "pursuit", "ipa": "pərˈsuːt", "m": "ⓝ 추구; 일, 활동", "d": [["ⓝ", "the act of trying to achieve something", "무언가를 이루려고 애쓰는 행위"], ["ⓝ", "an activity that you spend time doing", "시간을 들여 하는 활동"]], "et": "pro (앞으로) + sequi (따르다)", "ex": "앞서가는 것을 뒤쫓음 → 추구", "g": [["유의어", "search (추구), quest (탐색)"], ["파생어", "pursue ⓥ (추구하다, 뒤쫓다)"]], "c": ["in (the) pursuit of A (A를 추구하여)", "the pursuit of autonomy (자율성의 추구)"], "s": [["Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.", "자유주의 문화 같은 일부 문화는 공정한 기회 균등을 추구하면서 가족의 역할에 점점 더 많은 제한을 가하고, 교육, 의료, 그리고 사회의 다른 적극적 권리를 위한 더 평등주의적인 정부 프로그램을 시행하는 것을 택할 수도 있다.", "본문", ""], ["At the heart of this process is the tension between the professions' pursuit of autonomy and the public's demand for accountability.", "이 과정의 핵심에는 전문직의 자율성 추구와 대중의 책임성 요구 사이의 긴장이 있다.", "2022-평가원-9월", ""], ["Others, however, see science as a purely \"objective\" pursuit, uninfluenced by the cultural viewpoint and values of those who create it.", "그러나 다른 사람들은 과학을 그것을 만드는 사람들의 문화적 관점과 가치관에 영향을 받지 않는, 순전히 '객관적인' 활동으로 본다.", "2024-고2-교육청-9월", ""]]}, {"w": "assign", "ipa": "əˈsaɪn", "m": "ⓥ (일·책임 등을) 맡기다, 배정하다; (가치 등을) 부여하다", "d": [["ⓥ", "to give someone a job or responsibility", "누군가에게 일이나 책임을 주다"], ["ⓥ", "to give a particular value or role to something", "어떤 것에 특정한 가치나 역할을 부여하다"]], "et": "ad (~에) + signare (표시하다)", "ex": "~에 표시해 정해 주다 → 배정하다", "g": [["유의어", "allocate (할당하다), give (주다), designate (지정하다)"], ["파생어", "assignment ⓝ (과제, 배정)"]], "c": ["assign A to B (A를 B에게 맡기다)", "assign value to A (A에 가치를 부여하다)", "be assigned to A (A에 배정되다)"], "s": [["On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.", "반면 유교 문화 같은 다른 문화는 복지 책임을 주로 가족에게 맡기는 것을 선호할 수도 있는데, 그러면서 국가 안에서 모든 사람의 기본적 자유와 권리가 보호되는 한 가족의 존재에서 비롯되는 불평등을 받아들인다.", "본문", ""], ["It does not, in general, assign value to the inputs.", "그것은 일반적으로 투입물에 가치를 부여하지 않는다.", "2024-고2-교육청-9월", ""], ["Most of us assign separate functions to separate rooms, but even if you look at a one-room house you will find the same internal specialization.", "우리 대부분은 서로 다른 방에 서로 다른 기능을 부여하지만, 방이 하나뿐인 집을 보더라도 똑같은 내부의 분화를 발견할 것이다.", "2023-평가원-9월", ""]]}, {"w": "welfare", "ipa": "ˈwelfer", "m": "ⓝ 복지, 행복, 안녕", "d": [["ⓝ", "the health, comfort, and happiness of a person or group; help given to people in need", "개인이나 집단의 건강·편안함·행복; 도움이 필요한 사람에게 주는 지원"]], "et": "well (잘) + fare (지내다)", "ex": "잘 지냄 → 복지", "g": [[" eguard the reliability of A (A의 신뢰성을 지키다)"], "s": [["On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.", "반면 유교 문화 같은 다른 문화는 복지 책임을 주로 가족에게 맡기는 것을 선호할 수도 있는데, 그러면서 국가 안에서 모든 사람의 기본적 자유와 권리가 보호되는 한 가족의 존재에서 비롯되는 불평등을 받아들인다.", "본문", ""], ["It is critical that participants safeguard the reliability of information, supporting a more informed and rational public community.", "참여자들이 정보의 신뢰성을 지켜서, 더 잘 알고 더 합리적인 공공 공동체를 뒷받침하는 것이 중요하다.", "2025-평가원-9월", ""], ["Stories such as this one fuel suspicion — but also lead to further safeguards in the scientific process.", "이와 같은 이야기는 의심을 부추기지만, 과학적 과정에서 추가적인 안전장치로 이어지기도 한다.", "2025-고2-교육청-3월", ""]]}]}, {"q": "31", "t": "빈칸", "items": [{"w": "systematic", "ipa": "ˌsɪstəˈmætɪk", "m": "ⓐ 체계적인, 조직적인", "d": [["ⓐ", "done according to a fixed plan or method, in a careful way", "정해진 계획이나 방법에 따라 꼼꼼하게 행해지는"]], "et": "system (체계) + -atic (형용사형 어미)", "ex": "체계에 따른", "g": [["유의어", "organized (조직적인), orderly (질서 정연한)"], ["반의어", "random (무작위의), unsystematic (비체계적인)"], ["파생어", "system ⓝ (체계), systematically ad. (체계적으로)"]], "c": ["in a systematic way (체계적으로)", "the systematic collection of A (A의 체계적인 수집)"], "s": [["Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "20세기에 통계는 국가가 필요로 하는 양적 정보의 체계적인 수집이 되었다.", "본문", ""], ["The widening gap between data and information calls for the systematic development of tools that can turn data tombs into “golden nuggets” of knowledge.", "자료와 정보 사이의 격차가 커짐에 따라 '자료 무덤'을 지식의 '금덩어리'로 바꿀 수 있는 도구의 체계적인 개발이 필요하다.", "2024-고2-교육청-3월", ""], ["They remember, in a systematic way, how often sounds occur, in what order, with what intervals, and with what changes of pitch.", "그들은 소리가 얼마나 자주, 어떤 순서로, 어떤 간격으로, 그리고 음높이가 어떻게 변하며 나오는지를 체계적으로 기억한다.", "2021-고1-교육청-11월", ""]]}, {"w": "collection", "ipa": "kəˈlekʃən", "m": "ⓝ 수집, 모으기; 모음, 소장품; 모금", "d": [["ⓝ", "the act of gathering things or information together", "사물이나 정보를 함께 모으는 행위"], ["ⓝ", "a group of things or people", "사물이나 사람의 무리"]], "et": "col (함께) + legere (모으다) + -tion (명사형 어미)", "ex": "함께 모음 → 수집", "g": [["유의어", "gathering (수집), accumulation (축적), set (모음)"], ["파생어", "collect ⓥ (모으다), collector ⓝ (수집가)"]], "c": ["the collection of information[data] (정보[자료]의 수집)", "a collection of A (A의 모음)"], "s": [["Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "20세기에 통계는 국가가 필요로 하는 양적 정보의 체계적인 수집이 되었다.", "본문", ""], ["In everyday life, we tend to see any collection of people as a group.", "일상생활에서 우리는 어떤 사람들의 모임이든 하나의 집단으로 보는 경향이 있다.", "2023-평가원-9월", ""], ["As such, early human writing is dominated by wheeling and dealing: a collection of bets, bills, and contracts.", "그래서 초기 인류의 글은 거래, 즉 내기, 청구서, 계약서의 모음이 대부분을 차지한다.", "2020-수능", ""]]}, {"w": "quantitative", "ipa": "ˈkwɑːntəteɪtɪv", "m": "ⓐ 양적인, 수량적인", "d": [["ⓐ", "relating to amounts or numbers", "양이나 수와 관련된"]], "et": "라틴어 quantitas (양) + -ive (형용사형 어미)", "ex": "양에 관한", "g": [["유의어", "numerical (수의), measurable (측정할 수 있는)"], ["반의어", "qualitative (질적인)"], ["파생어", "quantity ⓝ (양), quantify ⓥ (수량화하다)"]], "c": ["quantitative information[data] (양적 정보[자료])"], "s": [["Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "20세기에 통계는 국가가 필요로 하는 양적 정보의 체계적인 수집이 되었다.", "본문", ""], ["Issues that can be expressed in quantitative, measurable units are easy to slice.", "양적이고 측정 가능한 단위로 표현될 수 있는 문제는 나누어 다루기 쉽다.", "2023-수능", ""]]}, {"w": "state", "ipa": "steɪt", "m": "ⓝ 국가, 나라; 주(州); 상태 ⓥ 진술하다, 말하다", "d": [["ⓝ", "a country considered as a political organization, or its government", "정치 조직으로서의 국가, 또는 그 정부"], ["ⓝ", "the condition of something at a particular time", "특정 시점에서 어떤 것의 상태"]], "et": "라틴어 status (서 있는 상태)", "ex": "확립된 상태 → 국가(정치 체제); 상태", "g": [["유의어", "nation (국가), government (정부), condition (상태)"], ["관련어", "sovereign (주권의), citizen (시민)"]], "c": ["state power[authority] (국가 권력[권위])", "the state of nature (자연 상태)"], "s": [["Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.", "20세기에 통계는 국가가 필요로 하는 양적 정보의 체계적인 수집이 되었다.", "본문", ""], ["Hence, the only place where morality and moral liberty will begin to find an application begins in a place where a sovereign power, namely the state, emerges.", "따라서 도덕과 도덕적 자유가 적용되기 시작하는 유일한 곳은 주권 권력, 즉 국가가 등장하는 곳이다.", "2024-고2-교육청-10월", ""], ["The entrance to a honeybee colony, often referred to as the dancefloor, is a market place for information about the state of the colony and the environment outside the hive.", "흔히 무도장이라 불리는 꿀벌 군집의 입구는 군집의 상태와 벌집 바깥 환경에 관한 정보를 주고받는 시장이다.", "2023-수능", ""]]}, {"w": "industrialize", "ipa": "ɪnˈdʌstriəlaɪz", "m": "ⓥ 산업화하다, 공업화하다", "d": [["ⓥ", "to develop industries in a country or area on a large scale", "한 나라나 지역에서 산업을 대규모로 발전시키다"]], "et": "industrial (산업의) + -ize (동사형 어미)", "ex": "산업화하다", "g": [["파생어", "industry ⓝ (산업), industrial ⓐ (산업의), industrialization ⓝ (산업화)"]], "c": ["industrialized cultures[nations] (산업화된 문화[나라])"], "s": [["This process occurred in all the industrialised countries as a key part of their becoming modern states.", "이 과정은 모든 산업화된 나라에서 그 나라들이 근대 국가가 되는 핵심적인 부분으로서 일어났다.", "본문", ""], ["In industrialized and computerized cultures, the performing arts become economically unstable because the institutions which sustain them increasingly depend on public and corporate funding.", "산업화되고 컴퓨터화된 문화에서는 공연 예술을 지탱하는 기관들이 점점 더 공공 및 기업 자금에 의존하기 때문에 공연 예술이 경제적으로 불안정해진다.", "2026-수능", ""]]}, {"w": "simultaneously", "ipa": "ˌsaɪməlˈteɪniəsli", "m": "ad. 동시에, 일제히", "d": [["ad.", "at exactly the same time", "정확히 같은 시간에"]], "et": "라틴어 simul (동시에) + -aneous (형용사형 어미) + -ly (부사형 어미)", "ex": "동시에", "g": [["유의어", "at the same time (동시에)"], ["파생어", "simultaneous ⓐ (동시의)"]], "c": [], "s": [["Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "Desrosières는 \"측정되는 대상이 실제로 존재한다는 것과 이것이 단지 하나의 관례일 뿐이라는 것을 동시에 생각하기는 어렵다\"라고 쓴다.", "본문", ""], ["Second, and simultaneously, an unconscious monitoring process tests whether the operating system is functioning effectively.", "둘째로, 그리고 동시에, 무의식적인 감시 과정이 작동 체계가 효과적으로 기능하고 있는지를 검사한다.", "2021-평가원-9월", ""], ["This means it might be better to have plans in place about how to pursue both simultaneously.", "이는 둘 다를 동시에 추구하는 방법에 관한 계획을 마련해 두는 것이 더 나을 수 있다는 뜻이다.", "2026-수능", ""]]}, {"w": "measure", "ipa": "ˈmeʒər", "m": "ⓥ 측정하다, 재다; 평가하다 ⓝ 조치, 대책; 척도", "d": [["ⓥ", "to find the size, amount, or degree of something", "어떤 것의 크기·양·정도를 알아내다"], ["ⓝ", "an action taken to achieve a purpose; a way of judging something", "목적을 이루기 위해 취하는 행동; 어떤 것을 판단하는 방법"]], "et": "라틴어 mensura (측정) ← metiri (재다)", "ex": "재다 → 측정하다; 잣대", "g": [["유의어", "calculate (계산하다), assess (평가하다), quantify (수량화하다)"], ["파생어", "measurement ⓝ (측정), measurable ⓐ (측정할 수 있는)"]], "c": ["take measures (조치를 취하다)", "be measured by A (A로 측정되다)"], "s": [["Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "Desrosières는 \"측정되는 대상이 실제로 존재한다는 것과 이것이 단지 하나의 관례일 뿐이라는 것을 동시에 생각하기는 어렵다\"라고 쓴다.", "본문", ""], ["We can roughly say that measuring the mass of a star involves various theories.", "대략적으로 말해, 별의 질량을 측정하는 데에는 다양한 이론이 관련된다.", "2024-고2-교육청-10월", ""], ["Information has become a recognized entity to be measured, evaluated, and priced.", "정보는 측정되고, 평가되고, 가격이 매겨지는 공인된 실체가 되었다.", "2019-수능", ""]]}, {"w": "convention", "ipa": "kənˈvenʃən", "m": "ⓝ 관례, 관습, 인습; (대규모) 대회", "d": [["ⓝ", "a way of doing something that most people accept as usual or correct", "대부분의 사람이 보통이거나 옳다고 받아들이는 일 처리 방식"], ["ⓝ", "a large formal meeting", "대규모 공식 회의"]], "et": "con (함께) + venire (오다) + -tion (명사형 어미)", "ex": "함께 모여 정한 것 → 관례; 대회", "g": [["유의어", "custom (관습), tradition (전통), norm (규범), practice (관행)"], ["파생어", "conventional ⓐ (관례적인, 전통적인)"]], "c": ["culture and convention (문화와 관습)"], "s": [["Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".", "Desrosières는 \"측정되는 대상이 실제로 존재한다는 것과 이것이 단지 하나의 관례일 뿐이라는 것을 동시에 생각하기는 어렵다\"라고 쓴다.", "본문", ""], ["Overly rigid habits and conventions, no matter how well-considered or well-intentioned, threaten innovation.", "아무리 잘 숙고되었거나 좋은 의도에서 나온 것이라도, 지나치게 경직된 습관과 관례는 혁신을 위협한다.", "2025-평가원-9월", ""], ["They belong to no tradition, strictly speaking have no style, and are not understood within a framework of culture and convention.", "그것들은 어떤 전통에도 속하지 않고, 엄밀히 말해 양식도 없으며, 문화와 관습의 틀 안에서 이해되지도 않는다.", "2021-평가원-9월", ""]]}, {"w": "phenomenon", "ipa": "fəˈnɑːmɪnɑːn", "m": "ⓝ 현상 (pl. phenomena)", "d": [["ⓝ", "something that happens or exists, especially something that is studied", "일어나거나 존재하는 것, 특히 연구 대상이 되는 것"]], "et": "그리스어 phainomenon (나타나는 것) ← phainein (보이다)", "ex": "눈에 보이게 나타나는 것 → 현상", "g": [["유의어", "event (사건), fact (사실)"]], "c": ["a biological[natural] phenomenon (생물학적[자연] 현상)"], "s": [["Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["To modern man disease is a biological phenomenon that concerns him only as an individual and has no moral implications.", "현대인에게 질병은 개인으로서의 그에게만 관련되고 도덕적 의미는 없는 생물학적 현상이다.", "2018-수능", ""], ["Namely, the pleasure consists of being challenged and struggling to understand and decode the phenomenon present to view.", "즉 그 즐거움은 눈앞에 보이는 현상을 이해하고 해독하도록 도전받고 애쓰는 데 있다.", "2022-평가원-9월", ""]]}, {"w": "charge", "ipa": "tʃɑːrdʒ", "m": "ⓥ (요금을) 청구하다; 충전하다; 고발하다 ⓝ 요금; 책임; 충전", "d": [["ⓥ", "to ask someone to pay a particular amount of money", "누군가에게 특정한 금액을 지불하라고 요구하다"], ["ⓝ", "the amount of money you have to pay; responsibility for something", "지불해야 하는 금액; 어떤 일에 대한 책임"]], "et": "라틴어 carricare (짐을 싣다)", "ex": "짐을 지우다 → (부담·요금을) 지우다", "g": [["유의어", "bill (청구하다), fee (요금), cost (비용)"]], "c": ["charge A for B (B에 대해 A에게 요금을 청구하다)", "free of charge (무료로)", "in charge of A (A를 책임지는)"], "s": [["Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["The price that the farmer gets from the wholesaler is much more flexible from day to day than the price that the retailer charges consumers.", "농부가 도매상에게서 받는 가격은 소매상이 소비자에게 청구하는 가격보다 날마다 훨씬 더 유동적이다.", "2019-평가원-6월", ""], ["Mass travel to spectator sports, especially football and horse-racing, where people could be charged for entry, was now possible.", "입장료를 받을 수 있는 관중 스포츠, 특히 축구와 경마를 보러 대규모로 이동하는 것이 이제 가능해졌다.", "2019-수능", ""]]}, {"w": "category", "ipa": "ˈkætəɡɔːri", "m": "ⓝ 범주, 부류", "d": [["ⓝ", "a group of people or things with particular features in common", "특정한 특징을 공통으로 가진 사람이나 사물의 집단"]], "et": "그리스어 kategoria (진술, 분류)", "ex": "분류된 무리 → 범주", "g": [["유의어", "class (부류), group (집단), type (유형), kind (종류)"], ["파생어", "categorize ⓥ (분류하다)"]], "c": ["fall into a category (어떤 범주에 속하다)"], "s": [["Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["Process-addiction behaviors (workaholism, shopaholism, and the like) fall into this category as well.", "과정 중독 행동(일 중독, 쇼핑 중독 등)도 이 범주에 속한다.", "2024-고2-교육청-3월", ""], ["Indeed, what distinguishes a park from the broader category of public space is the representation of nature that parks are meant to embody.", "실제로 공원을 공공 공간이라는 더 넓은 범주와 구별 짓는 것은 공원이 구현하도록 되어 있는 자연의 재현이다.", "2023-수능", ""]]}, {"w": "classification", "ipa": "ˌklæsɪfɪˈkeɪʃən", "m": "ⓝ 분류, 유형화", "d": [["ⓝ", "the act of putting things into groups according to their type", "사물을 종류에 따라 집단으로 나누는 행위"]], "et": "class (부류) + facere (만들다) + -ation (명사형 어미)", "ex": "부류로 만듦 → 분류", "g": [["유의어", "categorization (범주화), grouping (분류)"], ["파생어", "classify ⓥ (분류하다)"]], "c": ["a classification system (분류 체계)"], "s": [["Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["But there is also a ready-made system of classification embodied in our language.", "그러나 우리 언어에 구현된, 이미 만들어진 분류 체계도 있다.", "2022-수능", ""], ["This new classification system of his led to conflicts with many mineralogists who followed the conventional methods.", "그의 이 새로운 분류 체계는 기존의 방법을 따르던 많은 광물학자들과의 갈등으로 이어졌다.", "2025-고2-교육청-3월", ""]]}, {"w": "aggregation", "ipa": "ˌæɡrɪˈɡeɪʃən", "m": "ⓝ 집계, 집합(체), 모음", "d": [["ⓝ", "the act of collecting separate things together into one group or total", "분리된 것들을 하나의 집단이나 합계로 모으는 일"]], "et": "ad (~로) + grex (무리) + -ation (명사형 어미)", "ex": "무리 ial policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["Official definitions of sport have important implications.", "스포츠의 공식적인 정의는 중요한 함의를 지닌다.", "2021-평가원-6월", ""], ["It is a rare kind of bear known to be the official mammal of British Columbia.", "그것은 브리티시컬럼비아주의 공식 포유동물로 알려진 희귀한 종류의 곰이다.", "2020-평가원-6월", ""]]}, {"w": "devise", "ipa": "dɪˈvaɪz", "m": "ⓥ 고안하다, 창안하다", "d": [["ⓥ", "to invent a plan, system, or method", "계획·체계·방법을 생각해 내다"]], "et": "고대 프랑스어 deviser (나누다, 고안하다)", "ex": "궁리하여 짜내다", "g": [["유의어", "design (설계하다), invent (발명하다), create (만들다), develop (개발하다), come up with (생각해 내다)"], ["파생어", "device ⓝ (장치)"]], "c": ["devise a plan[regulations] (계획[규칙]을 고안하다)", "be devised to do (~하도록 고안되다)"], "s": [["Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.", "청구되는 가격이나 판매되는 제품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위해 국가의 목적에 이바지하도록 고안된다.", "본문", ""], ["Political institutions at central, regional, and local levels must allow users to devise their own regulations and independently ensure observance.", "중앙, 지역, 지방 차원의 정치 기관들은 이용자들이 스스로 규칙을 고안하고 독자적으로 준수를 보장할 수 있도록 해야 한다.", "2022-수능", ""]]}, {"w": "serve", "ipa": "sɜːrv", "m": "ⓥ (목적 등에) 이바지하다, 도움이 되다; (역할을) 하다; 제공하다", "d": [["ⓥ", "to be useful for a particular purpose", "특정한 목적에 유용하다"], ["ⓥ", "to act as or perform a particular role", "특정한 역할을 하다"]], "et": "라틴어 servire (섬기다)", "ex": "섬기다 → 이바지하다, 도움이 되다", "g": [["유의어", "fulfill (이행하다), function (기능하다), act (역할을 하다)"], ["파생어", "service ⓝ (봉사, 서비스)"]], "c": ["serve the purpose of A (A의 목적에 이바지하다)", "serve as A (A로서 역할을 하다)", "serve a function (기능을 하다)"], "s": [["Phenomena such as prices being charged and products being sold  "본문", ""], ["But on the other hand, literature has historically been seen as dangerous: it promotes the questioning of authority and social arrangements.", "그러나 다른 한편으로 문학은 역사적으로 위험한 것으로 여겨져 왔는데, 권위와 사회 질서에 대한 의문 제기를 촉진하기 때문이다.", "2024-고2-교육청-10월", ""], ["What makes questioning authority so hard?", "무엇이 권위에 의문을 제기하는 것을 그토록 어렵게 만드는가?", "2024-고2-교육청-9월", ""]]}, {"w": "quantification", "ipa": "ˌkwɑːntɪfɪˈkeɪʃən", "m": "ⓝ 수량화, 정량화", "d": [["ⓝ", "the act of expressing something as a number or amount", "무언가를 수나 양으로 나타내는 일"]], "et": "quantify (수량화하다) + -ation (명사형 어미)", "ex": "수량화", "g": [["유의어", "measurement (측정)"], ["파생어", "quantify ⓥ (수량화하다), quantity ⓝ (양), quantitative ⓐ (양적인)"]], "c": [], "s": [["Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", "Theodore Porter는 국가 권위를 만들어 내는 통계의 사용을 \"수량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방식이다\"라고 묘사하며, 그것을 권위에 대한 신뢰를 쌓기 위한 '사회적 기술'로 규정했다.", "본문", ""]]}, {"w": "characterize", "ipa": "ˈkærəktəraɪz", "m": "ⓥ (~으로) 규정하다, 특징짓다; ~의 특징이 되다", "d": [["ⓥ", "to describe the character or qualities of something in a particular way", "어떤 것의 성격이나 특성을 특정한 방식으로 묘사하다"], ["ⓥ", "to be a typical feature of something", "어떤 것의 전형적인 특징이 되다"]], "et": "character (특성) + -ize (동사형 어미)", "ex": "특성을 부여하다 → 특징짓다", "g": [["유의어", "describe (묘사하다), define (정의하다), portray (묘사하다), distinguish (특징짓다)"], ["파생어", "character ⓝ (성격, 특징), characteristic ⓝⓐ (특징; 특유의)"]], "c": ["characterize A as B (A를 B로 규정하다)", "be characterized by A (A가 특징이다)"], "s": [["Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", "Theodore Porter는 국가 권위를 만들어 내는 통계의 사용을 \"수량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방식이다\"라고 묘사하며, 그것을 권위에 대한 신뢰를 쌓기 위한 '사회적 기술'로 규정했다.", "본문", ""], ["It is a century that is characterized by knowledge as the important resource that gains competitive advantage for companies.", "그것은 기업에 경쟁 우위를 가져다주는 중요한 자원으로서의 지식이 특징인 세기이다.", "2020-평가원-6월", ""], ["Music is an extremely important aspect of culture, shaping and transmitting the above-mentioned aspects that characterize groups of people.", "음악은 문화의 극히 중요한 측면으로, 사람들의 집단을 특징짓는 앞서 언급한 측면들을 형성하고 전달한다.", "2021-평가원-9월", ""]]}, {"w": "intend", "ipa": "ɪnˈtend", "m": "ⓥ 의도하다, ~할 작정이다", "d": [["ⓥ", "to have something in your mind as a plan or purpose", "계획이나 목적으로 어떤 것을 마음에 두다"]], "et": "in (~쪽으로) + tendere (뻗다)", "ex": "마음을 ~쪽으로 뻗다 → 의도하다", "g": [["유의어", "mean (의도하다), aim (목표로 하다), plan (계획하다)"], ["파생어", "intention ⓝ (의도), intentional ⓐ (의도적인), intended ⓐ (의도된)"]], "c": ["be intended to do (~하도록 의도되다)", "well intended (선의의)"], "s": [["Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.", "Theodore Porter는 국가 권위를 만들어 내는 통계의 사용을 \"수량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방식이다\"라고 묘사하며, 그것을 권위에 대한 신뢰를 쌓기 위한 '사회적 기술'로 규정했다.", "본문", ""], ["Historically, the professions and society have engaged in a negotiating process intended to define the terms of their relationship.", "역사적으로 전문직과 사회는 그들 관계의 조건을 정하기 위한 협상 과정에 참여해 왔다.", "2022-평가원-9월", ""], ["Although the government rescue may be well intended, it can negatively affect the behavior of banks, encouraging risky and poor decision making.", "정부의 구제는 좋은 의도에서 나온 것일 수 있지만, 은행의 행동에 부정적인 영향을 미쳐 위험하고 잘못된 의사 결정을 부추길 수 있다.", "2024-고2-교육청-6월", ""]]}]}, {"q": "32", "t": "빈칸", "items": [{"w": "expert", "ipa": "ˈekspɜːrt", "m": "ⓝ 전문가 ⓐ 전문적인, 숙련된", "d": [["ⓝ", "someone who has special skill or knowledge in a particular subject", "특정 분야에 특별한 기술이나 지식을 가진 사람"]], "et": "라틴어 expertus (시험을 거친, 경험 많은) ← experiri (시험해 보다)", "ex": "경험이 많은 사람 → 전문가", "g": [["유의어", "specialist (전문가), professional (전문가), authority (권위자)"], ["반의어", "beginner (초보자), novice (초보자), amateur (비전문가)"], ["파생어", "expertise ⓝ (전문 지식)"]], "c": ["an expert in[on] A (A의 전문가)", "expert judgement (전문가의 판단)"], "s": [["Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "와인의 맛과 색에 관한 전문가가 그러한 특성의 기저에 있는 화학을 앎으로써 많은 것을 얻듯이, 신체에 대한 각각의 관점도 잠재적으로 다른 관점들을 향상시킬 수 있다.", "본문", ""], ["Experts' tastes did move in the proper direction: they favored finer, more expensive wines.", "전문가들의 취향은 실제로 올바른 방향으로 움직였다. 그들은 더 고급스럽고 더 비싼 와인을 선호했다.", "2019-평가원-9월", ""], ["All experts are not the same, nor do they submit their work to the same scrutiny.", "모든 전문가가 같은 것은 아니며, 그들이 모두 자신의 연구를 똑같이 엄밀한 검토에 맡기는 것도 아니다.", "2025-고2-교육청-3월", ""]]}, {"w": "underlie", "ipa": "ˌʌndərˈlaɪ", "m": "ⓥ (underlay-underlain) ~의 기저를 이루다, ~의 근본이 되다", "d": [["ⓥ", "to be the basic cause of something or the thing that makes it possible", "어떤 것의 근본 원인이 되거나 그것을 가능하게 하다"]], "et": "under (아래에) + lie (놓여 있다)", "ex": "아래에 놓여 있다 → 기저를 이루다", "g": [["유의어", "form the basis of (~의 기초를 이루다), support (뒷받침하다)"], ["파생어", "underlying ⓐ (근본적인, 기저에 있는)"]], "c": ["the chemistry that underlies A (A의 기저에 있는 화학 작용)"], "s": [["Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "와인의 맛과 색에 관한 전문가가 그러한 특성의 기저에 있는 화학을 앎으로써 많은 것을 얻듯이, 신체에 대한 각각의 관점도 잠재적으로 다른 관점들을 향상시킬 수 있다.", "본문", ""], ["Not only does memory underlie our ability to think at all, it defines the content of our experiences and how we preserve them for years to come.", "기억은 우리가 생각할 수 있는 능력의 기저를 이룰 뿐 아니라, 우리 경험의 내용과 그것을 수년간 간직하는 방식을 규정한다.", "2021-고1-교육청-11월", ""]]}, {"w": "quality", "ipa": "ˈkwɑːləti", "m": "ⓝ 특성, 자질; 질, 품질", "d": [["ⓝ", "a characteristic or feature of someone or something", "사람이나 사물의 특성이나 특징"], ["ⓝ", "how good or bad something is", "어떤 것이 얼마나 좋거나 나쁜지"]], "et": "라틴어 qualis (어떤 종류의)", "ex": "어떤 종류인가 → 특성; 질", "g": [["유의어", "characteristic (특징), attribute (속성), feature (특징), trait (특성)"]], "c": ["a cluster of qualities (여러 특성의 묶음)"], "s": [["Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "와인의 맛과 색에 관한 전문가가 그러한 특성의 기저에 있는 화학을 앎으로써 많은 것을 얻듯이, 신체에 대한 각각의 관점도 잠재적으로 다른 관점들을 향상시킬 수 있다.", "본문", ""], ["By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc.", "내가 말하는 '능력'이란 영리함, 일을 해내는 능력, 현명한 결정 등 여러 특성의 묶음을 의미한다.", "2024-고2-교육청-9월", ""], ["Within the same metric structure, there is a wide potential of variations in tempo, volume, tonal quality and intonation.", "같은 박자 구조 안에서도 템포, 음량, 음색, 억양에는 폭넓은 변이 가능성이 있다.", "2023-평가원-9월", ""]]}, {"w": "perspective", "ipa": "pərˈspektɪv", "m": "ⓝ 관점, 시각, 견해; 원근법", "d": [["ⓝ", "a particular way of thinking about something", "어떤 것에 대한 특정한 사고방식"]], "et": "per (꿰뚫어) + specere (보다)", "ex": "꿰뚫어 봄 → 관점", "g": [["유의어", "viewpoint (관점), point of view (관점), outlook (견해), angle (각도, 관점)"]], "c": ["from a different perspective (다른 관점에서)", "a global perspective (세계적인 시각)"], "s": [["Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.", "와인의 맛과 색에 관한 전문가가 그러한 특성의 기저에 있는 화학을 앎으로써 많은 것을 얻듯이, 신체에 대한 각각의 관점도 잠재적으로 다른 관점들을 향상시킬 수 있다.", "본문", ""], ["Each event allows the student to examine the concept from a different perspective.", "각 활동은 학생이 그 개념을 다른 관점에서 살펴볼 수 있게 해 준다.", "2020-평가원-6월", ""], ["This opportunity will be great for developing a global perspective and lifelong memories.", "이번 기회는 세계적인 시각과 평생의 추억을 키우는 데 아주 좋을 것입니다.", "2019-평가원-6월", ""]]}, {"w": "potentially" d loneliness in his work,\" she said eagerly.", "\"그가 작품에서 고립감과 외로움을 어떻게 전달했는지 보면 정말 놀라울 거야.\"라고 그녀는 열의에 차서 말했다.", "2023-평가원-9월", ""]]}, {"w": "specialist", "ipa": "ˈspeʃəlɪst", "m": "ⓝ 전문가 ⓐ 전문적인, 전문가의", "d": [["ⓝ", "someone who knows a lot about a particular subject", "특정 주제에 대해 많이 아는 사람"], ["ⓐ", "relating to a particular area of knowledge", "특정 지식 분야와 관련된"]], "et": "special (특별한) + -ist (사람)", "ex": "특별한 분야의 사람 → 전문가", "g": [["유의어", "expert (전문가), professional (전문가)"], ["파생어", "specialize ⓥ (전문으로 하다), specialized ⓐ (전문화된)"]], "c": ["a specialist topic[field] (전문 주제[분야])"], "s": [["How different types of cell communicate with one another becomes its own specialist topic.", "서로 다른 유형의 세포가 어떻게 서로 소통하는지가 그 자체로 하나의 전문 주제가 된다.", "본문", ""], ["In these environments specialists often see the project as an opportunity to test and enrich their skill sets.", "이러한 환경에서 전문가들은 흔히 그 프로젝트를 자신의 기술을 시험하고 풍부하게 할 기회로 여긴다.", "2024-평가원-9월", ""], ["Thus, importation programs, to date, are largely a matter of trial and error based on experience of the individual specialists involved.", "따라서 지금까지 (천적) 도입 프로그램은 대체로 관련된 개별 전문가들의 경험에 근거한 시행착오의 문제이다.", "2019-평가원-6월", ""]]}, {"w": "whole", "ipa": "hoʊl", "m": "ⓝ 전체, 전부 ⓐ 전체의, 온전한", "d": [["ⓝ", "all of something, considered as a single unit", "하나의 단위로 여겨지는 어떤 것의 전부"], ["ⓐ", "complete; not divided into parts", "완전한; 부분으로 나뉘지 않은"]], "et": "고대 영어 hal (온전한, 다치지 않은)", "ex": "빠짐없이 온전한 → 전체", "g": [["유의어", "entire (전체의), complete (완전한), total (전체의)"], ["반의어", "part (부분)"]], "c": ["as a whole (전체로서)", "the whole of A (A의 전체)"], "s": [["Even simple forms of life on Earth are now rarely studied as a whole, and the human body is evidently much more complex.", "지구상의 단순한 생명체조차 이제는 전체로서 연구되는 일이 드물며, 인체는 분명 그보다 훨씬 더 복잡하다.", "본문", ""], ["The nineteenth century, as we have observed, was the last to believe that the world, as a whole as well as in its parts, could ever be perfectly known.", "앞서 살펴보았듯이, 19세기는 세계가 부분적으로뿐 아니라 전체로서도 언젠가 완벽하게 알려질 수 있다고 믿은 마지막 세기였다.", ubjects, emphasizing their elevated position.", "궁전에 큰 창문이 도입되면서 통치자들은 말 그대로 신하들을 내려다볼 수 있게 되었고, 이는 그들의 높은 지위를 강조했다.", "본문", ""], ["These sounds can be combined into chains to form a literally unlimited number of words.", "이 소리들은 사슬처럼 결합되어 말 그대로 무한한 수의 단어를 만들어 낼 수 있다.", "2025-평가원-9월", ""], ["Misprints in a book or in any written message usually have a negative impact on the content, sometimes (literally) fatally.", "책이나 어떤 글에서든 오자는 대개 내용에 부정적인 영향을 미치며, 때로는 (말 그대로) 치명적이다.", "2024-수능", ""]]}, {"w": "subject", "ipa": "ⓝ ˈsʌbdʒɪkt", "m": "ⓝ 신하, 백성; 주제; 피험자 ⓐ (to) ~의 대상이 되는", "d": [["ⓝ", "a person who lives under the rule of a king or queen", "왕이나 여왕의 통치 아래 사는 사람"], ["ⓝ", "a person or thing that is being studied", "연구 대상이 되는 사람이나 사물"]], "et": "sub (아래에) + iacere (던지다)", "ex": "아래에 던져진 자 → 지배받는 사람; (논의의) 대상", "g": [["유의어", "citizen (시민), topic (주제), participant (참가자)"], ["반의어", "ruler (통치자)"]], "c": ["be subject to A (A의 대상이 되다)", "human subjects (인간 피험자)"], "s": [["The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.", "궁전에 큰 창문이 도입되면서 통치자들은 말 그대로 신하들을 내려다볼 수 있게 되었고, 이는 그들의 높은 지위를 강조했다.", "본문", ""], ["Regulations covering scientific experiments on human subjects are strict.", "인간 피험자를 대상으로 하는 과학 실험에 관한 규정은 엄격하다.", "2021-수능", ""], ["Presentational styles have been subject to a tension between an informational-educational purpose and the need to engage us entertainingly.", "보도 방식은 정보 제공·교육적 목적과 우리를 재미있게 끌어들여야 할 필요 사이의 긴장의 대상이 되어 왔다.", "2022-수능", ""]]}, {"w": "emphasize", "ipa": "ˈemfəsaɪz", "m": "ⓥ 강조하다, 두드러지게 하다", "d": [["ⓥ", "to show that something is especially important", "어떤 것이 특히 중요하다는 것을 보여 주다"]], "et": "그리스어 emphasis (드러냄) + -ize (동사형 어미)", "ex": "드러내 보이다 → 강조하다", "g": [["유의어", "stress (강조하다), highlight (강조하다)"], ["반의어", "downplay (경시하다), minimize (최소화하다)"], ["파생어", "emphasis ⓝ (강조)"]], "c": ["emphasize the need for A (A의 필요성을 강조하다)"], "s": [["The introduction of large windows i imes people muted their opinions rather than talking about them, especially if those opinions were perceived to be unpopular.", "독일의 정치 연구자로서 Noelle-Neumann은 선거 운동 기간에 특정 견해가 다른 견해보다 더 많이 거론되는 것처럼 보이며, 때때로 사람들이, 특히 자기 의견이 인기가 없다고 여겨질 경우, 그것에 대해 말하기보다 입을 다문다는 것을 관찰했다.", "본문", ""], ["I arrived at the nail salon, and muted my cellphone so that I would be disconnected for the hour and feel calm and peaceful.", "나는 네일숍에 도착해서 그 한 시간 동안 연결을 끊고 차분하고 평화롭게 느끼려고 휴대 전화를 무음으로 했다.", "2022-고1-교육청-11월", ""]]}, {"w": "opinion", "ipa": "əˈpɪnjən", "m": "ⓝ 의견, 견해; 여론", "d": [["ⓝ", "your ideas or beliefs about a particular subject", "특정 주제에 대한 생각이나 믿음"]], "et": "라틴어 opinari (생각하다, 판단하다)", "ex": "생각한 것 → 의견", "g": [["유의어", "view (견해), belief (신념), judgment (판단), position (입장)"]], "c": ["popular[public] opinion (여론)", "express one's opinion (의견을 표현하다)"], "s": [["As a political researcher in Germany, Noelle-Neumann observed that during election campaigns, certain views seemed to get more play than others, and sometimes people muted their opinions rather than talking about them, especially if those opinions were perceived to be unpopular.", "독일의 정치 연구자로서 Noelle-Neumann은 선거 운동 기간에 특정 견해가 다른 견해보다 더 많이 거론되는 것처럼 보이며, 때때로 사람들이, 특히 자기 의견이 인기가 없다고 여겨질 경우, 그것에 대해 말하기보다 입을 다문다는 것을 관찰했다.", "본문", ""], ["But in countries where popular opinion is taken into consideration, no mutually acceptable solution has been found.", "그러나 여론이 고려되는 나라들에서는 서로 받아들일 수 있는 해결책이 발견되지 않았다.", "2019-평가원-9월", ""], ["Sometimes these internal narratives we form not only shape our beliefs and opinions but also become deeply rooted in our identity.", "때때로 우리가 형성하는 이러한 내적 서사는 우리의 신념과 의견을 형성할 뿐 아니라 우리 정체성에 깊이 뿌리내리기도 한다.", "2026-수능", ""]]}, {"w": "perceive", "ipa": "pərˈsiːv", "m": "ⓥ 인식하다, 지각하다, 여기다", "d": [["ⓥ", "to notice or become aware of something", "무언가를 알아차리거나 인식하게 되다"], ["ⓥ", "to think of something in a particular way", "어떤 것을 특정한 방식으로 생각하다"]], "et": "per (완전히) + capere (잡다)", "ex": "완전히 붙잡다 → 알아차리다", "g": [["유의어", "recognize (인식하다), notice (알아차리다), regard (여기다), see (보다)"], ["파생어", "perception ⓝ (지각, 인식)"]], "c": ["perceive A as B (A를 B로 여기다)", "be perceived to be A (A로 여겨지다)"], "s": [["The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet.", "침묵의 나선은 자기 의견이 대중적이라고 인식하는 개인은 그것을 표현하는 반면, 자기 의견이 대중적이라고 생각하지 않는 사람들은 조용히 있을 때 일어난다.", "본문", ""], ["However, one part of your brain sees its shape, another sees color, another detects location, and another perceives movement.", "그러나 뇌의 한 부분은 그것의 형태를 보고, 다른 부분은 색을 보고, 또 다른 부분은 위치를 감지하며, 또 다른 부분은 움직임을 지각한다.", "2023-수능", ""], ["Intuitively and quickly, we mentally sort things into groups based on what we perceive the differences between them to be, and that is the basis for stereotyping.", "우리는 직관적이고 빠르게, 사물들 사이의 차이라고 인식하는 것에 근거해 그것들을 마음속으로 여러 집단으로 분류하며, 그것이 고정관념의 근거가 된다.", "2024-평가원-9월", ""]]}, {"w": "spiral", "ipa": "ˈspaɪrəl", "m": "ⓝ 나선, 소용돌이; (점점 심해지는) 연쇄적 상승[하강] ⓥ 나선형으로 움직이다; 급증[급감]하다", "d": [["ⓝ", "a shape that winds around a central point; a process in which something gets steadily worse or greater", "중심점을 감아 도는 모양; 어떤 것이 꾸준히 악화되거나 커지는 과정"]], "et": "라틴어 spira (꼬인 것, 고리)", "ex": "꼬여 도는 모양 → 나선", "g": [["유의어", "cycle (순환)"]], "c": ["the spiral of silence (침묵의 나선)", "in a spiral (나선형으로)"], "s": [["Noelle-Neumann calls this the spiral of silence.", "Noelle-Neumann은 이것을 '침묵의 나선'이라고 부른다.", "본문", ""]]}, {"w": "silence", "ipa": "ˈsaɪləns", "m": "ⓝ 침묵, 고요 ⓥ 침묵시키다", "d": [["ⓝ", "the state of not speaking or making any sound", "말하거나 소리를 내지 않는 상태"]], "et": "라틴어 silere (조용히 있다) + -ence (명사형 어미)", "ex": "조용함 → 침묵", "g": [["유의어", "quiet (고요)"], ["반의어", "noise (소음)"], ["파생어", "silent ⓐ (조용한, 침묵하는)"]], "c": ["in silence (말없이)", "break the silence (침묵을 깨다)"], "s": [["Noelle-Neumann calls this the spiral of silence.", "Noelle-Neumann은 이것을 '침묵의 나선'이라고 부른다.", "본문", ""], ["Clara's silence, however, seemed to say that she was lost in her thoughts.", "그러나 Clara의 침묵은 그녀가 생각에 잠겨 있다고 말해 주는 듯했다.", "2024-수능", ""], ["The dead silence in the car made the drive painful.", "차 안의 쥐 죽은 듯한 침묵이 그 드라이브를 괴롭게 만들었다.", "2018-수능", ""]]}, {"w": "occur", "ipa": "əˈkɜːr", "m": "ⓥ 일어나다, 발생하다; (생각이) 떠오르다", "d": [["ⓥ", "to happen", "일어나다"], ["ⓥ", "(occur to) to come into someone's mind", "(occur to) 누군가의 머리에 떠오르다"]], "et": "ob (~을 향해) + currere (달리다)", "ex": "~쪽으로 달려오다 → 일어나다", "g": [["유의어", "happen (일어나다), take place (일어나다), arise (발생하다)"]], "c": ["occur to A (A에게 떠오르다)"], "s": [["The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet.", "침묵의 나선은 자기 의견이 대중적이라고 인식하는 개인은 그것을 표현하는 반면, 자기 의견이 대중적이라고 생각하지 않는 사람들은 조용히 있을 때 일어난다.", "본문", ""], ["Rather, we have to create a situation that doesn't actually occur in the real world.", "오히려 우리는 현실 세계에서 실제로는 일어나지 않는 상황을 만들어 내야 한다.", "2023-고2-교육청-6월", ""], ["How the bandwagon effect occurs is demonstrated by the history of measurements of the speed of light.", "밴드왜건 효과가 어떻게 일어나는지는 빛의 속도 측정의 역사가 보여 준다.", "2021-수능", ""]]}, {"w": "popular", "ipa": "ˈpɑːpjələr", "m": "ⓐ 인기 있는, 대중적인; 일반 대중의", "d": [["ⓐ", "liked or supported by many people", "많은 사람들이 좋아하거나 지지하는"], ["ⓐ", "relating to ordinary people", "일반 사람들과 관련된"]], "et": "라틴어 popularis (민중의) ← populus (민중)", "ex": "민중의 → 대중적인", "g": [["유의어", "widespread (널리 퍼진), common (일반적인)"], ["반의어", "unpopular (인기 없는)"], ["파생어", "popularity ⓝ (인기), popularize ⓥ (대중화하다)"]], "c": ["popular opinion (여론)", "popular culture (대중문화)"], "s": [["The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet.", "침묵의 나선은 자기 의견이 대중적이라고 인식하는 개인은 그것을 표현하는 반면, 자기 의견이 대중적이라고 생각하지 않는 사람들은 조용히 있을 때 일어난다.", "본문", ""], ["But the course was so popular that the registration closed almost as soon as it opened.", "그러나 그 강좌는 인기가 너무 많아서 접수가 시작되자마자 거의 바로 Staub suggested that younger children might feel more comfortable acting when they have the company of a peer, whereas older children might feel more concern about being judged by their peers and fear feeling embarrassed by overreacting.", "Staub은 더 어린 아이들은 또래와 함께 있을 때 행동하는 것을 더 편하게 느끼는 반면, 더 나이 든 아이들은 또래에게 평가받는 것을 더 걱정하고 과잉 반응해 창피를 당할까 봐 두려워할 수 있다고 제안했다.", "2024-고2-교육청-9월", ""], ["Musical sounds, he was saying, can be distinguished from those of nature by the fact that they involve the use of fixed pitches, whereas virtually all natural sounds consist of constantly fluctuating frequencies.", "그가 말한 것은, 음악 소리는 고정된 음높이를 사용한다는 사실에 의해 자연의 소리와 구별될 수 있는 반면, 사실상 모든 자연의 소리는 끊임없이 변하는 주파수로 이루어져 있다는 것이었다.", "2020-수능", ""]]}, {"w": "remain", "ipa": "rɪˈmeɪn", "m": "ⓥ (~한 상태로) 남아 있다, 계속 ~이다; 남다", "d": [["ⓥ", "to stay in the same place or condition", "같은 장소나 상태에 머물러 있다"]], "et": "re (뒤에) + manere (머무르다)", "ex": "뒤에 머무르다 → 남다", "g": [["유의어", "stay (머무르다), continue (계속되다), keep (유지하다), last (지속되다)"], ["반의어", "change (변하다), leave (떠나다)"], ["파생어", "remainder ⓝ (나머지), remains ⓝ (유적, 잔해)"]], "c": ["remain silent[quiet] (침묵을 지키다)"], "s": [["The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet.", "침묵의 나선은 자기 의견이 대중적이라고 인식하는 개인은 그것을 표현하는 반면, 자기 의견이 대중적이라고 생각하지 않는 사람들은 조용히 있을 때 일어난다.", "본문", ""], ["This was Nina's favorite season, but she remained silent for hours while Marie was driving.", "이때는 Nina가 가장 좋아하는 계절이었지만, Marie가 운전하는 동안 그녀는 몇 시간 동안 말없이 있었다.", "2020-수능", ""], ["Even in the latter case, they remain, at least partly, in an imaginary world.", "후자의 경우에도 그들은 적어도 부분적으로는 상상의 세계에 머물러 있다.", "2019-평가원-6월", ""]]}, {"w": "issue", "ipa": "ˈɪʃuː", "m": "ⓝ 쟁점, 문제; (잡지 등의) 호 ⓥ 발행하다, 발표하다", "d": [["ⓝ", "a subject or problem that people discuss or argue about", "사람들이 논의하거나 논쟁하는 주제나 문제"], ["ⓥ", "to officially give or produce something", "무언가를 공식적으로 내주거나 만들어 내다"]], "et": "라틴어  seeker.", "먼저 전문 검토자들이 자신의 주장을 검토하도록 하지 않고 기자 회견에서 이른바 발견을 발표하는 과학자는 누구든 자동으로 관심을 끌려는 사람이라고 혹평받는다.", "2019-평가원-6월", ""]]}, {"w": "post", "ipa": "poʊst", "m": "ⓥ (글·사진 등을) 게시하다, 올리다 ⓝ 게시물; 우편; 직책", "d": [["ⓥ", "to put information or a message on a website or social media", "웹사이트나 소셜 미디어에 정보나 메시지를 올리다"], ["ⓝ", "a message or piece of information put on a website", "웹사이트에 올린 메시지나 정보"]], "et": "라틴어 postis (기둥) → 기둥에 공고를 붙이다", "ex": "게시하다", "g": [["유의어", "upload (올리다), publish (게재하다), share (공유하다)"]], "c": ["post a comment (댓글을 게시하다)", "post A on social media (A를 소셜 미디어에 올리다)", "a blog post (블로그 게시물)"], "s": [["In everyday life, people express their opinions in a variety of ways: they talk about them, they wear buttons, they put bumper stickers on their cars, and they post their views on social media.", "일상생활에서 사람들은 다양한 방식으로 의견을 표현한다. 그것에 대해 이야기하고, 배지를 달고, 차에 범퍼 스티커를 붙이고, 소셜 미디어에 자기 견해를 게시한다.", "본문", ""], ["Felix was studying science using a video posted on the school web site.", "Felix는 학교 웹사이트에 게시된 동영상을 이용해 과학을 공부하고 있었다.", "2021-수능", ""], ["In particular, when people post positive comments they are expressions of appreciation for the experience that led to the post.", "특히 사람들이 긍정적인 댓글을 게시할 때, 그것은 그 게시물을 쓰게 한 경험에 대한 감사의 표현이다.", "2024-수능", ""]]}, {"w": "apt", "ipa": "æpt", "m": "ⓐ (to) ~하는 경향이 있는, ~하기 쉬운; 적절한", "d": [["ⓐ", "(apt to do) likely to do something", "(apt to do) 무언가를 할 가능성이 큰"], ["ⓐ", "suitable or appropriate", "알맞거나 적절한"]], "et": "라틴어 aptus (맞춰진, 적합한)", "ex": "꼭 맞는 → 적절한; ~하기 쉬운", "g": [["유의어", "likely (~할 것 같은), inclined (~하는 경향이 있는), prone (~하기 쉬운), suitable (적절한)"]], "c": ["be apt to do (~하는 경향이 있다)"], "s": [["According to this theory, people are more apt to do these kinds of things when they perceive that others share their opinions.", "이 이론에 따르면, 사람들은 다른 사람들이 자기 의견을 공유한다고 인식할 때 이런 종류의 일을 하는 경향이 더 크다.", "본문", ""], ["But the pop song will rarely be sung and played exactly as written; the singer is apt to embellish that vocal line to give it a “styling,” ju hoice rather than on a reason or system", "이유나 체계보다는 우연이나 개인적 선택에 근거한"]], "et": "라틴어 arbiter (판정하는 사람)", "ex": "판정하는 사람 마음대로의 → 임의적인", "g": [["유의어", "random (무작위의), subjective (주관적인)"], ["반의어", "objective (객관적인), necessary (필연적인)"], ["파생어", "arbitrariness ⓝ (임의성)"]], "c": ["an arbitrary choice (임의적인 선택)"], "s": [["We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.", "우리는 척도의 선택이 기술(記述)에서의 임의적인 선택이며, 그 선택에 의존하는 모든 특징은 척도에 좌우된다고 결론 내린다.", "본문", ""], ["Indeed, all differences are arbitrary, but drawing hard lines between categories hides this arbitrariness and can be severely damaging.", "사실 모든 차이는 임의적이지만, 범주 사이에 확고한 선을 긋는 것은 이러한 임의성을 감추며 심각한 해를 끼칠 수 있다.", "2025-고2-교육청-9월", ""]]}, {"w": "description", "ipa": "dɪˈskrɪpʃən", "m": "ⓝ 기술(記述), 묘사, 서술", "d": [["ⓝ", "a piece of writing or speech that says what something is like", "어떤 것이 어떠한지를 말하는 글이나 말"]], "et": "de (아래로) + scribere (쓰다) + -tion (명사형 어미)", "ex": "써 내려감 → 묘사", "g": [["유의어", "account (설명), portrayal (묘사), depiction (묘사), representation (표현)"], ["파생어", "describe ⓥ (묘사하다), descriptive ⓐ (기술하는)"]], "c": ["beyond description (이루 말할 수 없는)"], "s": [["We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.", "우리는 척도의 선택이 기술(記述)에서의 임의적인 선택이며, 그 선택에 의존하는 모든 특징은 척도에 좌우된다고 결론 내린다.", "본문", ""], ["Scientism is the view that the scientific description of reality is the only truth there is.", "과학주의는 실재에 대한 과학적 기술이 존재하는 유일한 진리라는 견해이다.", "2020-수능", ""], ["The breathtaking scene that surrounded them was beyond description.", "그들을 둘러싼 숨 막히는 경치는 이루 말할 수 없었다.", "2024-수능", ""]]}]}, {"q": "36", "t": "글의 순서", "items": [{"w": "creature", "ipa": "ˈkriːtʃər", "m": "ⓝ 생물, 동물; (특정한 성질을 지닌) 존재", "d": [["ⓝ", "any living thing, especially an animal", "살아 있는 모든 것, 특히 동물"]], "et": "라틴어 creatura (창조된 것) ← creare (창조하다)", "ex": "창조된 것 → 생물", "g": [["유의어", "being (존재) "et": "manage (다루다) ← 이탈리아어 maneggiare (손으로 다루다) + -ment", "ex": "손으로 다룸 → 관리", "g": [["유의어", "control (통제), administration (관리), supervision (감독)"], ["파생어", "manage ⓥ (관리하다), manager ⓝ (관리자)"]], "c": ["wildlife management (야생 동물 관리)", "management decisions (경영상의 결정)"], "s": [["There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management.", "야생 동물이 관리되는 방식은 수없이 많지만, 그것들은 모두 (책임 있는) 관리를 내포하며 크게 두 범주, 즉 적극적 관리와 비적극적 관리로 분류될 수 있다.", "본문", ""], ["Some people have defined wildlife damage management as the science and management of overabundant species, but this definition is too narrow.", "어떤 사람들은 야생 동물 피해 관리를 과잉 번식한 종에 관한 과학과 관리로 정의해 왔지만, 이 정의는 너무 좁다.", "2020-평가원-6월", ""], ["It is the responsibility of management to prevent or, at least, to ease these fears.", "이러한 두려움을 막거나 적어도 덜어 주는 것은 경영진의 책임이다.", "2022-수능", ""]]}, {"w": "population", "ipa": "ˌpɑːpjuˈleɪʃən", "m": "ⓝ 개체군, 개체 수; 인구", "d": [["ⓝ", "all the animals of a particular type living in a particular area", "특정 지역에 사는 특정 종류의 모든 동물"], ["ⓝ", "the number of people living in a place", "어떤 곳에 사는 사람의 수"]], "et": "라틴어 populus (사람들) + -ation (명사형 어미)", "ex": "사람들의 수 → 인구; 개체군", "g": [["유의어", "community (군집), inhabitants (주민)"], ["파생어", "populous ⓐ (인구가 많은)"]], "c": ["population growth (인구[개체 수] 증가)"], "s": [["Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "개체군은 서식지를 그 개체군에 이롭게 또는 불리하게 바꿈으로써 적극적으로 관리될 수도 있다.", "본문", ""], ["In this case, one of the negative values associated with a peregrine falcon population is that its predation reduces the population of another endangered species.", "이 경우 송골매 개체군과 관련된 부정적 가치 중 하나는 그것의 포식이 또 다른 멸종 위기 종의 개체 수를 줄인다는 것이다.", "2020-평가원-6월", ""], ["The real threat to biodiversity is surely the need to convert ever more of our planet into production zones to feed the ever-increasing human population.", "생물 다양성에 대한 진짜 위협은 분명 끊임없이 증가하는 인구를 먹여 살리기 위해 우리 행성의 더 많은 부분을 생산 지대로 바꿔야 할 필요이다.", "2021-평가원-9월", ""]]}, {"w": "manner", "ipa": "ˈmænər", "m": "ⓝ 방식, 방법; 태도; (pl.) 예절", "d": [["ⓝ", "the way in which something is done", "무언가가 행해지는 방식"]], "et": "라틴어 manuarius (손의) ← manus (손)", "ex": "손으로 다루는 방식", "g": [["유의어", "way (방식), method (방법), fashion (방식), mode (방식)"]], "c": ["in a direct[cautious] manner (직접적인[신중한] 방식으로)", "in this manner (이런 방식으로)"], "s": [["Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively.", "적극적 관리는 개체군에 직접적인 방식으로 무언가를 하는데, 예를 들어 이주나 사냥 같은 전략을 통해 각각 그 규모를 늘리거나 줄인다.", "본문", ""], ["But the examination of the accuracy of information obtained in this manner is not a simple matter.", "그러나 이런 방식으로 얻은 정보의 정확성을 검토하는 것은 간단한 문제가 아니다.", "2018-평가원-9월", ""], ["Thus, she may prescribe the behavior to them by uttering the norm statement in a prescriptive manner.", "따라서 그녀는 규범 진술을 규정적인 방식으로 말함으로써 그들에게 그 행동을 지시할 수도 있다.", "2024-수능", ""]]}, {"w": "strategy", "ipa": "ˈstrætədʒi", "m": "ⓝ 전략, 계획", "d": [["ⓝ", "a plan of action designed to achieve a particular goal", "특정 목표를 이루기 위해 고안된 행동 계획"]], "et": "그리스어 strategia (장군의 직무) ← strategos (장군)", "ex": "장군의 작전 → 전략", "g": [["유의어", "plan (계획), approach (접근법), tactic (전술), scheme (계획)"], ["파생어", "strategic ⓐ (전략적인)"]], "c": ["develop a strategy (전략을 세우다)", "an effective strategy (효과적인 전략)"], "s": [["Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively.", "적극적 관리는 개체군에 직접적인 방식으로 무언가를 하는데, 예를 들어 이주나 사냥 같은 전략을 통해 각각 그 규모를 늘리거나 줄인다.", "본문", ""], ["As a result, the brain develops efficient strategies, becoming dependent on shortcuts.", "그 결과 뇌는 효율적인 전략을 개발하여 지름길에 의존하게 된다.", "2024-고2-교육청-10월", ""], ["Strategies are plans of action directing a military force when attacking another, and tactics are responses to conditions on the ground.", "전략은 군대가 다른 군대를 공격할 때 그것을 지휘하는 행동 계획이고, 전술은 현장 상황에 대한 대응이다.", "2025-고2-교육청-9월", ""]]}, {"w": "translocation", "ipa": "ˌtrænsloʊˈkeɪʃən", "m": "ⓝ (동식물의) 이주, 이동, 재배치", "d": [["ⓝ", "the act of moving animals or plants from one place to another", "동식물을 한 곳에서 다른 곳으로 옮기는 일"]], "et": "trans (가로질러) + locare (놓다) + -tion (명사형 어미)", "ex": "다른 곳으로 옮겨 놓음", "g": [["유의어", "transfer (이동), movement (이동)"], ["파생어", "location ⓝ (위치)"]], "c": [], "s": [["Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively.", "적극적 관리는 개체군에 직접적인 방식으로 무언가를 하는데, 예를 들어 이주나 사냥 같은 전략을 통해 각각 그 규모를 늘리거나 줄인다.", "본문", ""]]}, {"w": "respectively", "ipa": "rɪˈspektɪvli", "m": "ad. 각각, 제각기", "d": [["ad.", "in the same order as the things that have just been mentioned", "방금 언급한 것들과 같은 순서로"]], "et": "respective (각각의) + -ly (부사형 어미)", "ex": "각각", "g": [["유의어", "separately (각각), individually (개별적으로)"], ["파생어", "respective ⓐ (각각의)"]], "c": [], "s": [["Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively.", "적극적 관리는 개체군에 직접적인 방식으로 무언가를 하는데, 예를 들어 이주나 사냥 같은 전략을 통해 각각 그 규모를 늘리거나 줄인다.", "본문", ""]]}, {"w": "habitat", "ipa": "ˈhæbɪtæt", "m": "ⓝ 서식지, 거주지", "d": [["ⓝ", "the natural home of a plant or animal", "식물이나 동물의 자연적인 거처"]], "et": "라틴어 habitare (살다, 거주하다)", "ex": "사는 곳 → 서식지", "g": [["유의어", "environment (환경), home (거처), territory (영역)"], ["파생어", "inhabit ⓥ (서식하다), inhabitant ⓝ (주민, 서식 동물)"]], "c": ["habitat improvement (서식지 개선)", "provide a habitat for A (A에게 서식지를 제공하다)"], "s": [["Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "개체군은 서식지를 그 개체군에 이롭게 또는 불리하게 바꿈으로써 적극적으로 관리될 수도 있다.", "본문", ""], ["This provides a habitat for a wider range of species.", "이것은 더 다양한 종에게 서식지를 제공한다.", "2018-평가원-9월", ""], ["However, eventually, the young must locate, identify, and settle in a habitat that satisfies not only survivorship but reproductive needs as well.", "그러나 결국 새끼들은 생존뿐 아니라 번식에 필요한 것까지 충족하는 서식지를 찾아내고, 확인하고, 그곳에 정착해야 한다.", "2020-수능", ""]]}, {"w": "benefit", "ipa": "ˈbenɪfɪt", "m": "ⓝ 이익, 이점, 혜택 ⓥ 이익을 얻다; 이롭게 하다", "d": [["ⓝ", "an advantage or useful effect", "이점이나 유용한 효과"], ["ⓥ", "to be helped by something, or to help someone", "무언가의 도움을 받거나 누군가를 돕다"]], "et": "bene (좋게) + facere (하다)", "ex": "좋게 해 주는 것 → 이익", "g": [["유의어", "advantage (이점), gain (이득), profit (이익), help (돕다)"], ["반의어", "disadvantage (불리한 점), harm (해)"], ["파생어", "beneficial ⓐ (이로운)"]], "c": ["to the benefit of A (A에게 이롭게)", "benefit from A (A로부터 이익을 얻다)"], "s": [["Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "개체군은 서식지를 그 개체군에 이롭게 또는 불리하게 바꿈으로써 적극적으로 관리될 수도 있다.", "본문", ""], ["Studies of people struggling with major health problems show that the majority of respondents report they derived benefits from their adversity.", "심각한 건강 문제와 씨름하는 사람들에 대한 연구는 응답자 대다수가 역경에서 이득을 얻었다고 보고한다는 것을 보여 준다.", "2021-평가원-6월", ""], ["So we would like to offer you further benefits.", "그래서 저희는 고객님께 추가 혜택을 드리고자 합니다.", "2022-평가원-6월", ""]]}, {"w": "disadvantage", "ipa": "ˌdɪsədˈvæntɪdʒ", "m": "ⓝ 불리한 점, 단점, 불이익", "d": [["ⓝ", "something that makes someone or something less likely to succeed", "누군가나 무언가가 성공할 가능성을 낮추는 것"]], "et": "dis (반대) + advantage (유리함)", "ex": "유리하지 않음 → 불리한 점", "g": [["유의어", "drawback (결점), weakness (약점)"], ["반의어", "advantage (이점), benefit (이익)"]], "c": ["at a disadvantage (불리한 처지에)", "advantages and disadvantages (장단점)"], "s": [["Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.", "개체군은 서식지를 그 개체군에 이롭게 또는 불리하게 바꿈으로써 적극적으로 관리될 수도 있다.", "본문", ""], ["Such places may have disadvantages as well, however.", "그러나 그런 장소들에는 단점도 있을 수 있다.", "2018-평가원-9월", ""], ["Many anim ənt", "m": "ⓐ 의존하는, ~에 좌우되는", "d": [["ⓐ", "needing or affected by something else", "다른 것을 필요로 하거나 그것의 영향을 받는"]], "et": "depend (매달리다) + -ent (형용사형 어미)", "ex": "~에 매달려 있는 → 의존하는", "g": [["유의어", "reliant (의존하는), contingent (~을 조건으로 하는)"], ["반의어", "independent (독립적인)"], ["파생어", "depend ⓥ (의존하다), dependence ⓝ (의존)"]], "c": ["be dependent on A (A에 의존하다, A에 좌우되다)"], "s": [["Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product.", "판매량은 제품의 공급량과 연결되어 있는데, 공급량은 그 제품에 대한 수요에 직접적으로 좌우된다.", "본문", ""], ["While genetic advancements are often reported as environmentally dependent or modest in effect size in academic publications, these are often translated to the public in deterministic language through the media.", "유전학의 발전은 학술 출판물에서는 흔히 환경에 의존적이거나 효과 크기가 미미한 것으로 보고되지만, 미디어를 통해 대중에게는 흔히 결정론적인 언어로 옮겨진다.", "2020-평가원-9월", ""], ["The suburbs were far more dependent on the automobile, signaling the shift from primary dependence on public transportation to private cars.", "교외는 자동차에 훨씬 더 의존적이었는데, 이는 대중교통에 주로 의존하던 데서 자가용으로의 전환을 나타냈다.", "2024-평가원-9월", ""]]}, {"w": "demand", "ipa": "dɪˈmænd", "m": "ⓝ 수요; 요구 ⓥ 요구하다, 필요로 하다", "d": [["ⓝ", "the need or desire that people have for particular goods and services", "사람들이 특정 상품과 서비스에 대해 갖는 필요나 욕구"], ["ⓥ", "to ask for something firmly, or to need something", "무언가를 단호히 요구하거나 필요로 하다"]], "et": "de (완전히) + mandare (명령하다, 맡기다)", "ex": "강하게 명하다 → 요구하다", "g": [["유의어", "need (필요), request (요청), require (필요로 하다)"], ["반의어", "supply (공급)"], ["파생어", "demanding ⓐ (힘든, 요구가 많은)"]], "c": ["demand for A (A에 대한 수요[요구])", "consumer demand (소비자 수요)"], "s": [["Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product.", "판매량은 제품의 공급량과 연결되어 있는데, 공급량은 그 제품에 대한 수요에 직접적으로 좌우된다.", "본문", ""], ["In economic systems what takes place in one sector has impacts on another; demand for a good or service in one sector is derived from another.", "경제 체제에서는 한 부문에서 일어나는 일이 다른 부문에 영향을 미친다. 한 부문의 재화나 서비스에 대한 수요는 다른 부문에서 파생된다.", "2022-평가원-9월", ""], ["With population growth slowing, the strongest force increasing demand for more agricultural production will be rising incomes, which are desired by practically all governments and individuals.", "인구 증가가 둔화되면서, 더 많은 농업 생산에 대한 수요를 늘리는 가장 강력한 힘은 소득 증가가 될 것인데, 이는 사실상 모든 정부와 개인이 바라는 것이다.", "2020-평가원-9월", ""]]}, {"w": "eventually", "ipa": "ɪˈventʃuəli", "m": "ad. 결국, 마침내", "d": [["ad.", "in the end, especially after a long time or a lot of effort", "특히 오랜 시간이나 많은 노력 후에 마침내"]], "et": "e(x) (밖으로) + venire (오다) → event + -ual + -ly", "ex": "결과로 나와서 → 결국", "g": [["유의어", "finally (마침내), ultimately (궁극적으로), in the end (결국), at last (마침내)"], ["파생어", "eventual ⓐ (최종적인)"]], "c": [], "s": [["Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.", "따라서 제품이 결국 버려지도록 설계하면, 더 많은 제품에 대한 수요가 반드시 지속되게 할 수 있다.", "본문", ""], ["His most successful work, Popular Astronomy, was published in 1880, and eventually sold 130,000 copies.", "그의 가장 성공적인 작품인 'Popular Astronomy'는 1880년에 출판되어 결국 13만 부가 팔렸다.", "2023-고2-교육청-9월", ""], ["We cannot get by on reason alone since any reason always eventually leads to a feeling.", "어떤 이성이든 결국에는 언제나 감정으로 이어지기 때문에 우리는 이성만으로는 살아갈 수 없다.", "2023-고2-교육청-3월", ""]]}, {"w": "sustain", "ipa": "səˈsteɪn", "m": "ⓥ 지속시키다, 유지하다; 지탱하다", "d": [["ⓥ", "to make something continue for a period of time", "어떤 것을 일정 기간 계속되게 하다"], ["ⓥ", "to provide what is needed to support someone or something", "누군가나 무언가를 지탱하는 데 필요한 것을 제공하다"]], "et": "sub (아래에서) + tenere (잡다)", "ex": "아래에서 받쳐 잡다 → 지탱하다, 유지하다", "g": [["유의어", "maintain (유지하다), continue (계속하다), support (지탱하다), keep up (유지하다)"], ["파생어", "sustainable ⓐ (지속 가능한), sustainability ⓝ (지속 가능성)"]], "c": ["sustain effort[demand] (노력[수요]을 지속시키다)"], "s": [["Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.", "따라서 제품이 결국 버려지도록 설 , and use of cheap materials.", "계획적 진부화, 수리 도구에 대한 제한된 접근, 값싼 재료의 사용처럼, 낭비가 불가피하도록 하기 위한 많은 전략이 제품의 설계와 사용에 도입되어 왔다.", "본문", ""]]}, {"w": "access", "ipa": "ˈækses", "m": "ⓝ 접근, 이용; 접근권 ⓥ 접근하다, 이용하다", "d": [["ⓝ", "the right or opportunity to use something or enter a place", "무언가를 이용하거나 어떤 곳에 들어갈 권리나 기회"], ["ⓥ", "to find or get something, especially information", "무언가, 특히 정보를 찾거나 얻다"]], "et": "ad (~로) + cedere (가다)", "ex": "~로 다가감 → 접근", "g": [["유의어", "admission (입장), entry (출입), approach (접근)"], ["파생어", "accessible ⓐ (접근 가능한), accessibility ⓝ (접근성)"]], "c": ["access to A (A에 대한 접근(권))", "have access to A (A를 이용할 수 있다)"], "s": [["Many strategies have been incorporated into product design and use to ensure that waste is inevitable, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials.", "계획적 진부화, 수리 도구에 대한 제한된 접근, 값싼 재료의 사용처럼, 낭비가 불가피하도록 하기 위한 많은 전략이 제품의 설계와 사용에 도입되어 왔다.", "본문", ""], ["He was given unrivaled access to rock's biggest artists, including the Rolling Stones, Bob Dylan, and Ray Charles.", "그는 롤링 스톤스, 밥 딜런, 레이 찰스를 비롯한 록계 최고의 아티스트들에게 누구도 따라올 수 없을 만큼 가까이 다가갈 수 있었다.", "2018-수능", ""], ["Information creates power, and today a much larger part of the world's population has access to that power.", "정보는 힘을 만들어 내며, 오늘날 세계 인구의 훨씬 더 많은 부분이 그 힘에 접근할 수 있다.", "2019-평가원-6월", ""]]}, {"w": "repair", "ipa": "rɪˈper", "m": "ⓝ 수리, 수선 ⓥ 수리하다, 고치다", "d": [["ⓝ", "the act of fixing something that is broken or damaged", "부서지거나 손상된 것을 고치는 일"], ["ⓥ", "to fix something that is broken or damaged", "부서지거나 손상된 것을 고치다"]], "et": "re (다시) + parare (준비하다, 갖추다)", "ex": "다시 갖추다 → 고치다", "g": [["유의어", "fix (고치다), mend (수선하다), restore (복원하다), maintenance (유지 관리)"], ["반의어", "damage (손상시키다), break (부수다)"]], "c": ["repair services (수리 서비스)", "maintenance and repair (유지 관리와 수리)"], "s": [["Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.", "낭비가 수요를 이끄는 데 필요하다는 생각을 지지한 사람들은, 수리와 재제조를 통해 낭비를 없애는 것을 우선시하면 다른 종류의 수요, 즉 서비스로서의 제품이 생겨난다는 것을 깨닫지 못했다.", "본문", ""], ["Customers would bring things back if something went wrong; repair was thus an extension of fabrication.", "고객들은 무언가 잘못되면 물건을 다시 가져오곤 했으므로, 수리는 제작의 연장이었다.", "2022-수능", ""], ["They'll have to be repaired and cared for either by astronauts or an army of advanced robots.", "그것들은 우주 비행사나 첨단 로봇 군단이 수리하고 관리해야 할 것이다.", "2025-고2-교육청-9월", ""]]}, {"w": "consumer", "ipa": "kənˈsuːmər", "m": "ⓝ 소비자", "d": [["ⓝ", "a person who buys goods or services for their own use", "자신이 쓰기 위해 상품이나 서비스를 사는 사람"]], "et": "consume (소비하다) + -er (사람) ← con (완전히) + sumere (취하다)", "ex": "완전히 써 버리는 사람 → 소비자", "g": [["유의어", "customer (고객), buyer (구매자), user (사용자)"], ["반의어", "producer (생산자), manufacturer (제조업자)"], ["파생어", "consume ⓥ (소비하다), consumption ⓝ (소비)"]], "c": ["consumer demand (소비자 수요)"], "s": [["All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement.", "이 모든 전략은 소비자가 사용 중인 제품에 제한적으로만 접근하고 결국 교체품을 필요로 하게 만든다.", "본문", ""], ["In some countries they are then sprayed with ethylene before sale to the consumer to induce ripening.", "일부 나라에서는 그것들이 소비자에게 판매되기 전에 숙성을 유도하기 위해 에틸렌을 뿌린다.", "2021-평가원-6월", ""], ["Contingency pricing is the major way that personal injury and certain consumer cases are billed.", "성공 보수제는 인신 상해 사건과 일부 소비자 사건에서 비용이 청구되는 주된 방식이다.", "2023-수능", ""]]}, {"w": "replacement", "ipa": "rɪˈpleɪsmənt", "m": "ⓝ 교체(품), 대체(물); 후임자", "d": [["ⓝ", "something that takes the place of something else", "다른 것을 대신하는 것"], ["ⓝ", "the act of replacing something", "무언가를 교체하는 것"]], "et": "replace (대체하다) + -ment (명사형 어미)", "ex": "대체", "g": [["유의어", "substitute (대체물), alternative (대안)"], ["파생어", "replace ⓥ (대체하다)"]], "c": ["a replacement for A (A를 대신하는 것)", "require a replacement (교체품이 필요하다)"], "s": [["All these strategies ensure that the consumer will have limite ea is that when you are invested and have ownership in something, you overvalue that thing.", "그 생각은 여러분이 무언가에 투자하고 그것에 대한 소유권을 가지면 그것을 과대평가하게 된다는 것이다.", "2023-평가원-6월", ""], ["Lawyers sometimes describe ownership as a bundle of sticks.", "변호사들은 때때로 소유권을 막대기 다발로 묘사한다.", "2024-평가원-6월", ""]]}, {"w": "maintain", "ipa": "meɪnˈteɪn", "m": "ⓥ 유지하다; 주장하다; (건물·기계 등을) 관리하다", "d": [["ⓥ", "to make something continue in the same way or at the same level", "어떤 것을 같은 방식이나 수준으로 계속되게 하다"], ["ⓥ", "to say firmly that something is true", "어떤 것이 사실이라고 단호히 말하다"]], "et": "manus (손) + tenere (잡다)", "ex": "손에 쥐고 있다 → 유지하다", "g": [["유의어", "keep (유지하다), sustain (지속시키다), preserve (보존하다), claim (주장하다)"], ["반의어", "abandon (버리다), lose (잃다)"], ["파생어", "maintenance ⓝ (유지, 관리)"]], "c": ["maintain profit[balance] (이익[균형]을 유지하다)", "maintain that S V (~라고 주장하다)"], "s": [["With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.", "이러한 소유권의 전환으로 기업은 유지 관리 및 수리 서비스를 제공하여 이익을 유지하며, 오래가는 제품을 개발하도록 장려된다.", "본문", ""], ["Animals under normal circumstances maintain a very constant body weight and they eat and drink enough for their needs at regular intervals.", "정상적인 상황에서 동물은 매우 일정한 체중을 유지하며, 일정한 간격으로 필요한 만큼 먹고 마신다.", "2023-평가원-6월", ""], ["Nevertheless, we are able to recognize the face as the same, maintaining the underlying identity.", "그럼에도 우리는 근본적인 정체성을 유지하면서 그 얼굴을 같은 것으로 알아볼 수 있다.", "2024-고2-교육청-10월", ""]]}, {"w": "profit", "ipa": "ˈprɑːfɪt", "m": "ⓝ 이익, 수익 ⓥ 이익을 얻다", "d": [["ⓝ", "money that you gain from selling something or doing business", "무언가를 팔거나 사업을 해서 얻는 돈"], ["ⓥ", "to gain an advantage or money from something", "무언가에서 이익이나 돈을 얻다"]], "et": "pro (앞으로) + facere (만들다)", "ex": "앞으로 나아가게 하는 것 → 이익", "g": [["유의어", "gain (이득), income (수입), earnings (수익), benefit (이익)"], ["반의어", "loss (손실)"], ["파생어", "profitable ⓐ (수익성 있는)"]], "c": ["profit from A (A로 이익을 얻다)"], "s": [["With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.", "이러한 소유권의 전환으로 기업은 유지 관리 및 수리 서비스를 제공하여 이익을 유지하며, 오래가는 제품을 개발하도록 장려된다.", "본문", ""], ["Consistency and repeatability are more likely to suppress fresh thinking than to bring your company profit.", "일관성과 반복 가능성은 회사에 이익을 가져다주기보다 새로운 사고를 억누를 가능성이 더 크다.", "2024-고2-교육청-9월", ""], ["They may believe that the cost and delay of seeking a patent are too great or that secrecy better protects their investment and increases their profit.", "그들은 특허를 얻는 데 드는 비용과 지연이 너무 크다고, 또는 비밀 유지가 자신의 투자를 더 잘 보호하고 이익을 늘린다고 믿을 수도 있다.", "2025-수능", ""]]}, {"w": "maintenance", "ipa": "ˈmeɪntənəns", "m": "ⓝ 유지 관리, 보수; 유지", "d": [["ⓝ", "the work done to keep something in good condition", "무언가를 좋은 상태로 유지하기 위해 하는 일"]], "et": "maintain (유지하다) + -ance (명사형 어미)", "ex": "유지", "g": [["유의어", "care (관리), repair (수리), preservation (보존)"], ["파생어", "maintain ⓥ (유지하다)"]], "c": ["maintenance and repair (유지 관리와 수리)"], "s": [["With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.", "이러한 소유권의 전환으로 기업은 유지 관리 및 수리 서비스를 제공하여 이익을 유지하며, 오래가는 제품을 개발하도록 장려된다.", "본문", ""], ["By their very nature, the concepts of maintenance and repair are predominantly examined from a process-oriented perspective.", "본질적으로 유지 관리와 수리라는 개념은 주로 과정 중심의 관점에서 검토된다.", "2025-수능", ""], ["This becomes especially clear when you start to think about maintenance.", "이것은 유지 관리에 대해 생각하기 시작하면 특히 분명해진다.", "2025-고2-교육청-9월", ""]]}, {"w": "encourage", "ipa": "ɪnˈkɜːrɪdʒ", "m": "ⓥ 장려하다, 권장하다; 격려하다; 조장하다", "d": [["ⓥ", "to make someone more likely to do something", "누군가가 무언가를 할 가능성을 높이다"], ["ⓥ", "to give someone support or confidence", "누군가에게 지지나 자신감을 주다"]], "et": "en (~하게 하다) + courage (용기)", "ex": "용기를 북돋우다", "g": [["유의어", "promote (촉진하다), urge (권고하다), motivate (동기를 부여하다), support (지지하다)"], ["반의어", "discourage (단념시키다), prevent (막다)"], ["파생 , ["파생어", "rotate ⓥ (회전하다)"]], "c": ["the rotation of the Earth (지구의 자전)", "crop rotation (돌려짓기)"], "s": [["For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly.", "예를 들어 태평양의 기후 체계인 엘니뇨가 풍속을 극적으로 변화시키면, 그것은 지구의 자전을 약간 늦출 수 있다.", "본문", ""], ["Understanding the connection between a rapid turn rate and the alignment of the body close to the rotation axis tells her how to accomplish her turn successfully.", "빠른 회전 속도와 몸을 회전축에 가깝게 정렬하는 것 사이의 관계를 이해하면 그녀는 회전을 성공적으로 해내는 방법을 알게 된다.", "2024-고2-교육청-3월", ""], ["This changes the shape of the Earth ever so slightly, making it fatter around the middle, which in turns slows the rotation of the planet similarly to the way a ballet dancer slows her spin by spreading out her arms.", "이것은 지구의 모양을 아주 약간 바꾸어 가운데를 더 불룩하게 만들고, 이것이 다시 발레 무용수가 팔을 벌려 회전을 늦추는 것과 비슷한 방식으로 지구의 자전을 늦춘다.", "2022-고1-교육청-11월", ""]]}, {"w": "drag", "ipa": "dræɡ", "m": "ⓝ 제동, 방해(물), 저항 ⓥ 끌다, 질질 끌다", "d": [["ⓝ", "something that slows down movement or progress", "움직임이나 진행을 늦추는 것"], ["ⓥ", "to pull something along with difficulty", "무언가를 힘들게 끌다"]], "et": "고대 노르드어 draga (끌다)", "ex": "끌어당김 → (뒤에서 끄는) 저항", "g": [["유의어", "resistance (저항), obstacle (방해물), pull (끌다)"]], "c": ["act as a drag (제동 장치로 작용하다)", "drag A to B (A를 B로 끌고 가다)"], "s": [["Indeed, the Earth's spin is generally slowing because the moon's gravity is acting as a drag, so days are getting longer by about 1.7 milliseconds per century.", "실제로 달의 중력이 제동 장치처럼 작용하기 때문에 지구의 자전은 대체로 느려지고 있으며, 그래서 하루는 100년마다 약 1.7밀리초씩 길어지고 있다.", "본문", ""], ["Once in the water, Princess quickly found Rita and slowly dragged her to the shore to her grateful mother.", "물에 들어가자 Princess는 재빨리 Rita를 찾아 그녀를 천천히 해안으로 끌고 가서 고마워하는 그녀의 어머니에게 데려갔다.", "2019-평가원-6월", ""], ["An increasing awareness of our effect on the ocean is slowly seeping into the public agenda, dragging behind it a conversation that is decades overdue.", "바다에 미치는 우리의 영향에 대한 인식이 높아 inate the gap between man-made time and natural time.", "시간이 안정적이라고 오랫동안 여겨 온 인간은 자신의 노력으로 인간이 만든 시간과 자연의 시간 사이의 격차를 없앨 수 있다는 믿음을 고수하며 계속해서 수정을 가해 왔다.", "본문", ""]]}, {"w": "stick to", "ipa": "stɪk tuː", "m": "~을 고수하다, 지키다; ~에 달라붙다", "d": [["phr.", "to continue doing or believing something without changing", "바꾸지 않고 계속 어떤 것을 하거나 믿다"], ["phr.", "to become attached to a surface", "표면에 달라붙다"]], "et": "stick (달라붙다) + to (~에)", "ex": "~에 붙어 있다 → 고수하다", "g": [["유의어", "adhere to (~을 고수하다), hold on to (~을 고수하다), keep to (~을 지키다)"], ["반의어", "abandon (버리다), give up (포기하다)"]], "c": ["stick to one's belief (믿음을 고수하다)"], "s": [["Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time.", "시간이 안정적이라고 오랫동안 여겨 온 인간은 자신의 노력으로 인간이 만든 시간과 자연의 시간 사이의 격차를 없앨 수 있다는 믿음을 고수하며 계속해서 수정을 가해 왔다.", "본문", ""], ["You can still fry an egg, but the egg won't stick to the pan.", "여전히 달걀을 부칠 수는 있지만, 달걀은 팬에 달라붙지 않을 것이다.", "2024-수능", ""], ["Management contacted the stamp producer who made it clear that if people just moistened the stamps properly, they would stick to any piece of paper.", "경영진이 우표 제조사에 연락하자, 그 제조사는 사람들이 우표를 제대로 적시기만 하면 어떤 종이에든 붙을 것이라고 분명히 밝혔다.", "2021-고1-교육청-9월", ""]]}, {"w": "eliminate", "ipa": "ɪˈlɪmɪneɪt", "m": "ⓥ 없애다, 제거하다; 탈락시키다", "d": [["ⓥ", "to completely remove or get rid of something", "무언가를 완전히 없애거나 제거하다"]], "et": "e(x) (밖으로) + limen (문지방)", "ex": "문지방 밖으로 내보내다 → 없애다", "g": [["유의어", "remove (제거하다), get rid of (없애다)"], ["반의어", "add (더하다), include (포함하다)"], ["파생어", "elimination ⓝ (제거)"]], "c": ["eliminate A from B (B에서 A를 제거하다)", "eliminate risk[waste] (위험[낭비]을 없애다)"], "s": [["Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time.", "시간이 안정적이라고 오랫동안 여겨 온 인간은 자신의 노력으로 인간이 만든 시간과 자연의 시간 사이의 격차를 없앨 수 있다는 믿음을 고수하며 계속해서 수정을 가해 왔다.", "본문", ""], ["The mathematical theory of probability hasn't eliminated risk, but it allows us to manage that risk more effectively.", "확률에 관한 수학 이론은 위험을 없애지는 못했지만, 우리가 그 위험을 더 효과적으로 관리할 수 있게 해 준다.", "2023-수능", ""], ["Tell them that they can eliminate worry from their lives by simply refusing to attend to it.", "그들에게 걱정에 주의를 기울이기를 그저 거부함으로써 삶에서 걱정을 없앨 수 있다고 말해 주어라.", "2024-고2-교육청-9월", ""]]}, {"w": "gap", "ipa": "ɡæp", "m": "ⓝ 격차, 차이; 틈, 공백", "d": [["ⓝ", "a difference between two situations, groups, or amounts", "두 상황·집단·양 사이의 차이"], ["ⓝ", "an empty space or opening", "빈 공간이나 틈"]], "et": "고대 노르드어 gap (갈라진 틈)", "ex": "갈라진 틈 → 격차", "g": [["유의어", "difference (차이), divide (분열), space (공간)"]], "c": ["the gap between A and B (A와 B 사이의 격차)", "fill (in) the gaps (빈틈을 메우다)"], "s": [["Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time.", "시간이 안정적이라고 오랫동안 여겨 온 인간은 자신의 노력으로 인간이 만든 시간과 자연의 시간 사이의 격차를 없앨 수 있다는 믿음을 고수하며 계속해서 수정을 가해 왔다.", "본문", ""], ["Once they know the needs of a particular collector they can actively seek specific items to fill gaps in the collection.", "특정 수집가의 요구를 알게 되면, 그들은 수집품의 빈틈을 메우기 위해 특정 품목을 적극적으로 찾아 나설 수 있다.", "2025-평가원-9월", ""], ["However, we cannot understand the gap between human-rights ideals and the real world of human-rights violations by sympathy or by legal analysis.", "그러나 우리는 인권의 이상과 인권 침해라는 현실 세계 사이의 격차를 공감이나 법적 분석으로 이해할 수는 없다.", "2020-평가원-9월", ""]]}]}]}]</script>

function relItem(t){
  const m=t.match(/^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/);
  if(m) return '<li><span class="ent">'+esc(m[1])+'</span> <span class="ko">'+esc(m[2])+'</span></li>';
  const d=t.match(/^(\S+(?: \S+)?)\s+((?:ⓝ|ⓥ|ⓐ|ad\.|prep\.).*)$/);
  if(d) return '<li><span class="ent">'+esc(d[1])+'</span> <span class="ko">'+esc(d[2])+'</span></li>';
  return '<li><span class="ent">'+esc(t)+'</span></li>';
}
function card(it,i,q){
  const defs = it.d.map(([p,en,ko])=>'<div class="def"><span class="en">'+esc(en)+'</span><br><span class="k">'+esc(ko)+'</span></div>').join('');
  const rel = it.g.map(([lab,txt])=>'<div class="rrow"><span class="lab '+(CLS[lab]||'oth')+'">'+esc(lab)+'</span><ul>'+relList(txt).map(relItem).join('')+'</ul></div>').join('')
    + (it.c.length?'<div class="rrow"><span class="lab col">연어</span><ul>'+it.c.map(relItem).join('')+'</ul></div>':'');
  const exs = it.s.map(([en,ko,b])=>{
    const tag = b ? '<span class="src '+(b==='본문'?'pass':'gi')+'">'+esc(b)+'</span>' : '';
    return '<div class="exi"><div><div class="exen">'+tag+hl(en,it)+'</div><div class="exko">'+esc(ko)+'</div></div></div>';
  }).join('');
  return '<article class="card" data-s="'+esc((it.w+' '+it.m).toLowerCase())+'">'
    +'<div><div class="no">'+q+'번 · '+String(i+1).padStart(2,'0')+'</div><div class="head"><span class="word">'+esc(it.w)+'</span><span class="ipa">['+esc(it.ipa)+']</span></div>'
    +'<div class="mean">'+esc(it.m)+'</div>'+defs
    +'<div class="ety"><b>어원</b>'+esc(it.et)+(it.ex?'<br>➔ '+esc(it.ex):'')+'</div></div>'
    +'<div class="rel">'+rel+'</div><div class="exs">'+exs+'</div></article>';
}
function secHtml(sec){
  const [typ,ttl]=sec.t.split(' · ');
  return '<section class="qsec" data-q="'+sec.q+'"><div class="qhead"><span class="qno">'+sec.q+'<small>번</small></span><span class="qtitle"><span class="typ">'+esc(typ)+'</span>'+esc(ttl||'')+'</span><span class="qcnt">'+sec.items.length+'단어</span></div><div class="list">'+sec.items.map((it,i)=>card(it,i,sec.q)).join('')+'</div></section>';
}
let ex=EXAMS[0], cur='all';
$('#exams').innerHTML=EXAMS.map(e=>'<button class="exam" data-e="'+e.id+'" aria-pressed="false">'+esc(e.label)+'</button>').join('');
function renderExam(){
  $('#main').innerHTML=ex.secs.map(secHtml).join('');
  const n=ex.secs.reduce((a,s)=>a+s.items.length,0);
  $('#sub').textContent=ex.label+' 전국연합학력평가 · '+ex.range+' · '+ex.secs.length+'문항 '+n+'단어 · 발음, 뜻과 영영 풀이, 어원, 유의어·반의어·파생어, 연어, 예문(본문 + 기출 최대 2개)';
  $('#tabs').innerHTML='<button class="tab" data-q="all" aria-pressed="true">전체</button>'+ex.secs.map(s=>'<button class="tab" data-q="'+s.q+'" aria-pressed="false">'+s.q+'번</button>').join('');
  document.querySelectorAll('.exam').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.e===ex.id)));
}
function apply(){
  const term=$('#q').value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('section.qsec').forEach(sec=>{
    const inQ = cur==='all'||sec.dataset.q===cur; let n=0;
    sec.querySelectorAll('article.card').forEach(c=>{const ok=inQ&&(!term||c.dataset.s.includes(term)); c.classList.toggle('hidden',!ok); if(ok)n++;});
    sec.classList.toggle('hidden',n===0); shown+=n;
  });
  $('#empty').classList.toggle('hidden',shown>0);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.q===cur)));
}
function go(eid,q,push){
  const e=EXAMS.find(x=>x.id===eid)||EXAMS[0];
  if(e!==ex||!$('#main').children.length){ex=e;renderExam();}
  cur=(q&&ex.secs.some(s=>s.q===q))?q:'all'; apply();
  if(push){ try{history.replaceState(null,'','#'+ex.id+(cur==='all'?'':'-q'+cur));}catch(err){} }
  window.scrollTo({top:0});
}
$('#exams').addEventListener('click',e=>{const b=e.target.closest('.exam'); if(b) go(b.dataset.e,'all',true);});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) go(ex.id,b.dataset.q,true);});
$('#q').addEventListener('input',apply);
const fromHash=()=>{const m=location.hash.match(/^#([\w]+-\d+)(?:-q(\d\d))?$/); go(m?m[1]:EXAMS[0].id,m?m[2]:'all',false);};
window.addEventListener('hashchange',fromHash); fromHash();
$('#quiz').addEventListener('click',e=>{const on=!document.body.classList.contains('quiz'); document.body.classList.toggle('quiz',on); e.currentTarget.setAttribute('aria-pressed',String(on)); document.querySelectorAll('.revealed').forEach(x=>x.classList.remove('revealed'));});
$('#main').addEventListener('click',e=>{ if(!document.body.classList.contains('quiz'))return; const t=e.target.closest('.mean,.def .k,.exko,.rrow .ko'); if(t) t.classList.toggle('revealed');});
})();
</script>
</body>
</html>
