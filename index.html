<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우송고 고2 모의고사 어휘 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Layout: school-issued word book. Navy masthead with the WSH mark, sticky exam + question bar, one ruled entry per word (identity | relations, examples underneath). */
:root{
  --paper:#f4f6fa; --sheet:#ffffff; --ink:#18213a; --muted:#5b6478; --rule:#dce1ea;
  --navy:#21409a; --navy-ink:#ffffff; --navy-soft:#e8ecf7;
  --green:#3f8f33; --green-soft:#e6f2e2; --yellow:#f1b442; --yellow-ink:#7a5208; --yellow-soft:#fdf2db;
  --red:#b23a48; --red-soft:#f8e6e8;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf2; --muted:#9ba4b8; --rule:#2a3350;
    --navy:#8ea6ec; --navy-ink:#0f1424; --navy-soft:#1f2a4a;
    --green:#86cf78; --green-soft:#1b2e1d; --yellow:#f1b442; --yellow-ink:#f3c66d; --yellow-soft:#2f2614;
    --red:#ef8f9b; --red-soft:#3a1f25; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf2; --muted:#9ba4b8; --rule:#2a3350;
  --navy:#8ea6ec; --navy-ink:#0f1424; --navy-soft:#1f2a4a;
  --green:#86cf78; --green-soft:#1b2e1d; --yellow:#f1b442; --yellow-ink:#f3c66d; --yellow-soft:#2f2614;
  --red:#ef8f9b; --red-soft:#3a1f25; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.62}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

/* masthead */
header.mast{background:var(--sheet);border-bottom:1px solid var(--rule)}
header.mast .wrap{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;padding-top:20px;padding-bottom:18px}
.plate{background:#fff;border-radius:6px;padding:6px 8px;line-height:0;border:1px solid var(--rule)}
.plate img{height:58px;width:auto;display:block}
.mast h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.mast .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.stripe{height:4px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--yellow) 70% 85%,var(--green) 85% 100%)}

/* sticky bar */
nav.bar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(0,0,0,.02)}
nav.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exams{display:inline-flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden}
.exam{font:inherit;font-size:13.5px;font-weight:700;border:0;background:transparent;color:var(--navy);padding:6px 12px;cursor:pointer}
.exam+.exam{border-left:1px solid var(--navy)}
.exam[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.tools{display:flex;gap:8px;margin-left:auto}
#q{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);width:170px}
.toggle{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:inherit;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid transparent;background:transparent;color:var(--muted);padding:3px 10px;border-radius:4px;cursor:pointer}
.tab:hover{color:var(--ink);background:var(--paper)}
.tab[aria-pressed="true"]{color:var(--ink);border-color:var(--rule);background:var(--paper);box-shadow:inset 0 -3px 0 var(--yellow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* key */
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:14px 0 0}
.key span{display:inline-flex;align-items:center;gap:6px}

main{padding-bottom:64px}
section.qsec{margin-top:30px}
.qhead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:end;padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:12px}
.qno{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums;position:relative;padding-right:4px}
.qno small{font-family:var(--body);font-size:13px;font-weight:700;margin-left:1px}
.qtitle{font-size:16.5px;font-weight:700;text-wrap:balance}
.qtitle .typ{display:inline-block;font-size:12px;font-weight:700;color:var(--yellow-ink);background:var(--yellow-soft);border-radius:3px;padding:0 6px;margin-right:8px;vertical-align:2px}
.qcnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}

article.card{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--navy);border-radius:4px;padding:16px 20px 14px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:10px 28px}
.no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.word{font-family:var(--display);font-size:25px;font-weight:700;color:var(--navy)}
.ipa{font-family:var(--display);color:var(--muted);font-size:15px}
.mean{font-weight:700;font-size:15.5px;margin-top:2px}
.def{font-size:13.5px;color:var(--muted);margin-top:5px}
.def .en{font-family:var(--display);font-style:italic;color:var(--ink);font-size:14.5px}
.ety{margin-top:10px;font-size:13.5px;border-left:3px solid var(--yellow);background:var(--paper);padding:6px 10px}
.ety b{font-weight:700;margin-right:4px}
.rel{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.rrow{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:start}
.lab{font-size:11.5px;font-weight:700;padding:1px 0;text-align:center;line-height:1.75;border-radius:3px}
.lab.syn{background:var(--green-soft);color:var(--green)}
.lab.ant{background:var(--red-soft);color:var(--red)}
.lab.der{background:var(--navy-soft);color:var(--navy)}
.lab.oth{background:var(--yellow-soft);color:var(--yellow-ink)}
.lab.col{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.rrow ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.ent{font-family:var(--display);font-size:14.5px}
.ko{color:var(--muted)}
.exs{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:10px;counter-reset:ex}
.exi{display:grid;grid-template-columns:20px 1fr;gap:8px}
.exi::before{counter-increment:ex;content:counter(ex);font-size:12px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:3px;text-align:right}
.exen{font-family:var(--display);font-size:15.5px;line-height:1.55}
.exen mark{background:none;color:var(--navy);font-weight:700}
.exen mark.r{color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:2px;text-underline-offset:3px}
.exko{font-size:13.5px;color:var(--muted)}
.src{display:inline-block;font-family:var(--body);font-style:normal;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:3px;margin-right:7px;vertical-align:2px;line-height:1.7;font-variant-numeric:tabular-nums}
.src.pass{background:var(--navy);color:var(--navy-ink)}
.src.gi{background:transparent;color:var(--yellow-ink);border:1px solid var(--yellow);line-height:1.55}
.hidden{display:none!important}
body.quiz .mean,body.quiz .def .k,body.quiz .exko,body.quiz .rrow .ko{filter:blur(5px);cursor:pointer;transition:filter .15s}
body.quiz .revealed{filter:none!important}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);padding:16px 0 30px}
@media (max-width:760px){
  article.card{grid-template-columns:1fr;padding:14px 14px 12px}
  .plate img{height:44px}
  .mast h1{font-size:19px}
  .tools{margin-left:0;width:100%}
  #q{flex:1;width:auto}
  .qno{font-size:28px}
  .qhead{grid-template-columns:auto 1fr}
  .qcnt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  nav.bar,.key,footer{display:none}
  html{font-size:10px}
  body{font-size:10.5px;line-height:1.45}
  .wrap{max-width:none;padding:0}
  header.mast .wrap{padding:0 0 8px}
  .plate img{height:40px}
  .mast h1{font-size:16px}
  .tools{width:auto}
  section.qsec{margin-top:10px}
  section.qsec+section.qsec{break-before:page}
  .qhead{grid-template-columns:auto 1fr auto;margin-bottom:6px;padding-bottom:4px}
  .qno{font-size:22px}
  .qtitle{font-size:12.5px}
  .qcnt{display:inline}
  .list{gap:6px}
  article.card{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)!important;padding:8px 10px 7px!important;gap:4px 14px;break-inside:avoid;border-left-width:2px}
  .word{font-size:17px}
  .ipa{font-size:11px}
  .mean{font-size:11.5px}
  .def{font-size:10px;margin-top:2px}
  .def .en{font-size:10.5px}
  .ety{font-size:10px;margin-top:5px;padding:3px 7px}
  .rel{gap:3px;font-size:10px}
  .rrow{grid-template-columns:40px 1fr;gap:5px}
  .lab{font-size:9px}
  .ent{font-size:10.5px}
  .exs{gap:4px;padding-top:5px}
  .exi{grid-template-columns:14px 1fr;gap:5px}
  .exen{font-size:11px;line-height:1.4}
  .exko{font-size:10px}
  .src{font-size:8.5px}
  body{background:#fff;color:#000;font-size:11pt}
  article.card{page-break-inside:avoid}
  body.quiz .mean,body.quiz .def .k,body.quiz .exko,body.quiz .rrow .ko{filter:none}
}
</style>
</head>

에게서 통화 공급을 인플레이션 수준까지 늘릴 권한을 빼앗는 방법이다.", "2025-고2-교육청-6월", ""], ["But warmer air from global climate change caused these clouds to rise, depriving the forests of moisture, and the habitat for the golden toad and many other species dried up.", "그러나 지구 기후 변화로 인한 더 따뜻한 공기 때문에 이 구름들이 상승하여 숲에서 수분을 빼앗았고, 황금두꺼비와 다른 많은 종의 서식지가 말라 버렸다.", "2023-고2-교육청-6월", ""]]}, {"w": "diet", "ipa": "ˈdaɪət", "m": "ⓝ 식단, 식습관; 다이어트", "d": [["ⓝ", "the kind of food that a person or animal usually eats", "사람이나 동물이 평소에 먹는 음식의 종류"]], "et": "그리스어 diaita (생활 방식)", "ex": "생활 방식 → 식생활", "g": [["관련어", "nutrition (영양), nutrient (영양소), meal (식사)"]], "c": ["a balanced[healthy] diet (균형 잡힌[건강한] 식단)", "be on a diet (다이어트 중이다)"], "s": [["Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.", "반대로 '초미각자'는 브로콜리처럼 영양가는 높지만 약간 쓴 음식을 피할 수도 있어서, 그 결과 스스로 균형 잡힌 식단을 누리지 못하게 된다.", "본문", ""], ["Their diet is full of fresh fruits, fish, vegetables, whole grains, and nuts.", "그들의 식단은 신선한 과일, 생선, 채소, 통곡물, 견과류로 가득하다.", "2023-고2-교육청-6월", ""], ["This finding was unusual, since people who eat more fruit usually display the benefits associated with a healthy diet.", "과일을 더 많이 먹는 사람들은 보통 건강한 식단과 관련된 이점을 보이기 때문에, 이 결과는 특이했다.", "2023-고2-교육청-3월", ""]]}, {"w": "glamorous", "ipa": "ˈɡlæmərəs", "m": "ⓐ 화려한, 매력적인, 멋진", "d": [["ⓐ", "attractive and exciting in a way that seems special", "특별해 보일 만큼 매력적이고 흥미진진한"]], "et": "glamour (매력, 화려함) + -ous (형용사형 어미)", "ex": "매력이 넘치는", "g": [["유의어", "attractive (매력적인), fascinating (매혹적인), exciting (흥미진진한)"], ["반의어", "dull (따분한), plain (수수한)"]], "c": [], "s": [["So, although taste is not nearly as glamorous as vision, hearing, or even touch, it makes sense for you to pay closer attention to it because chemistry, at least in your mouth, could be destiny.", "그러므로 미각이 시각이나 청각, 심지어 촉각만큼 매력적이지는 전혀 않지만, 적어도 입안에서는 화학 작용이 운명이 될 수도 있으니 미각에 더 세심한 주의를 기울이는 것이 타당하다.", "본문", ""]]}, {"w": "chemistry", "ipa": "ˈkeməstri", "m": "ⓝ 9월", ""]]}]}, {"q": "22", "t": "요지", "items": [{"w": "testify", "ipa": "ˈtestɪfaɪ", "m": "ⓥ (to) 증명하다, ~의 증거가 되다; 증언하다", "d": [["ⓥ", "(testify to) to show clearly that something is true or exists", "(testify to) 어떤 것이 사실이거나 존재함을 분명히 보여 주다"], ["ⓥ", "to give evidence in a court of law", "법정에서 증언하다"]], "et": "라틴어 testis (증인) + facere (만들다)", "ex": "증인이 되다 → 증언하다, 증명하다", "g": [["유의어", "prove (증명하다), demonstrate (입증하다), show (보여 주다), confirm (확인하다)"]], "c": ["testify to A (A를 증명하다, A의 증거가 되다)"], "s": [["Experiments testify to science's embrace of ignorance.", "실험은 과학이 무지를 기꺼이 받아들인다는 것을 증명한다.", "본문", ""]]}, {"w": "embrace", "ipa": "ɪmˈbreɪs", "m": "ⓝ 수용; 포옹 ⓥ (기꺼이) 받아들이다, 수용하다; 껴안다", "d": [["ⓥ", "to accept an idea, belief, or change willingly and with enthusiasm", "생각·신념·변화를 기꺼이 열정적으로 받아들이다"], ["ⓝ", "the act of accepting something willingly; a hug", "무언가를 기꺼이 받아들이는 것; 포옹"]], "et": "em (안으로) + brace (두 팔)", "ex": "두 팔 안에 넣다 → 껴안다, 받아들이다", "g": [["유의어", "accept (받아들이다), welcome (환영하다), adopt (채택하다)"], ["반의어", "reject (거부하다), refuse (거절하다)"]], "c": ["embrace technology (기술을 받아들이다)"], "s": [["Experiments testify to science's embrace of ignorance.", "실험은 과학이 무지를 기꺼이 받아들인다는 것을 증명한다.", "본문", ""], ["Those who embraced the technology were able to integrate it into their work styles and excel.", "그 기술을 받아들인 사람들은 그것을 자신의 업무 방식에 통합하여 뛰어난 성과를 낼 수 있었다.", "2023-고2-교육청-3월", ""], ["From then on, he still loved order and routines, but also embraced the messy, unpredictable bits of life too.", "그때부터 그는 여전히 질서와 일과를 좋아했지만, 삶의 지저분하고 예측할 수 없는 부분들도 받아들였다.", "2024-고2-교육청-10월", ""]]}, {"w": "ignorance", "ipa": "ˈɪɡnərəns", "m": "ⓝ 무지, 알지 못함", "d": [["ⓝ", "lack of knowledge or information about something", "어떤 것에 대한 지식이나 정보의 부족"]], "et": "i(n) (아닌) + gnoscere (알다) + -ance (명사형 어미)", "ex": "알지 못하는 상태", "g": [["반의어", "knowledge (지식), awareness (인식)"], ["파생어", "ignore ⓥ (무시하다)"]], "c": [], "s": [["Experiments testify to science's embrace of ignorance.", "실험은 과학이 무지를 기꺼이 받아들인다는 것을 증명한다.", "본문", ""], ["Although not the explicit goal, the best science can really be seen as refining ignorance.", "명시적인 목표는 아니지만, 최고의 과학은 사실 무지를 정제하는 것으로 볼 수 있다.", "2019-수능", ""], ["The very features that create expertise in a specialized domain lead to ignorance in many others.", "전문 분야에서 전문 지식을 만들어 내는 바로 그 특징들이 다른 많은 분야에서는 무지로 이어진다.", "2022-수능", ""]]}, {"w": "arguably", "ipa": "ˈɑːrɡjuəbli", "m": "ad. 아마 틀림없이, 거의 확실히", "d": [["ad.", "used when stating an opinion that you think can be supported with reasons", "이유를 들어 뒷받침할 수 있다고 생각하는 의견을 말할 때 쓰여"]], "et": "arguable (논증할 수 있는) + -ly (부사형 어미)", "ex": "논증할 수 있을 만큼 → 아마 틀림없이", "g": [["유의어", "probably (아마), possibly (어쩌면)"], ["파생어", "argue ⓥ (주장하다), argument ⓝ (논거, 주장)"]], "c": [], "s": [["Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.", "아마도 과학자가 할 수 있는 최악의 일은 굳이 확인해 보지도 않고 주어진 시나리오에서 무슨 일이 일어날지 안다고 가정하는 것이다.", "본문", ""], ["However, they arguably work to reduce understanding by failing to provide the structural contexts for news events.", "그러나 그것들은 뉴스 사건의 구조적 맥락을 제공하지 못함으로써 아마 틀림없이 이해를 떨어뜨리는 작용을 한다.", "2022-수능", ""], ["Arguably, the Renaissance was a result of the exchange of ideas between these different groups in close contact with each other.", "아마 틀림없이 르네상스는 서로 가까이 접촉하던 이 서로 다른 집단들 사이의 생각 교류의 결과였다.", "2020-고1-교육청-11월", ""]]}, {"w": "scenario", "ipa": "səˈnærioʊ", "m": "ⓝ 시나리오, (가능성 있는) 상황, 각본", "d": [["ⓝ", "a description of a possible series of events that might happen", "일어날지도 모르는 가능한 일련의 사건에 대한 기술"]], "et": "이탈리아어 scenario ← scena (무대, 장면)", "ex": "무대 장면의 줄거리 → 예상되는 상황", "g": [["유의어", "situation (상황), case (경우)"]], "c": ["in a given scenario (주어진 상황에서)", "possible scenarios (가능한 시나리오들)"], "s": [["Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.", "아마도 과학자가 할 수 있는 최악의 일은 굳이 확인해 보지도 않고 주어진 시나리오에서 무슨 일이 일어날지 안다고 가정하는 것이다.", "본문", ""], ["To some extent, thinking through potential scenarios can be helpful.", "어느 정도까지는 가능한 시나리오를 깊이 생각해 보는 것이 도움이 될 수 있다.", "2026-평가원-6월", ""], ["The strategy is to analyze all the possible scenarios that the future holds and then to see what proportion of them lead to success or failure.", "그 전략은 미래에 일어날 수 있는 모든 시나리오를 분석한 다음, 그중 어느 정도의 비율이 성공 또는 실패로 이어지는지 알아보는 것이다.", "2023-수능", ""]]}, {"w": "bother", "ipa": "ˈbɑːðər", "m": "ⓥ 굳이 ~하다, 애써 ~하다; 괴롭히다, 신경 쓰이게 하다", "d": [["ⓥ", "to make the effort to do something", "무언가를 하려고 수고하다"], ["ⓥ", "to annoy or worry someone", "누군가를 성가시게 하거나 걱정시키다"]], "et": "아일랜드어 bodhar (귀가 먹은, 성가신)에서 유래했다는 설", "ex": "성가시게 하다 → 수고를 들이다", "g": [["유의어", "trouble (괴롭히다; 수고하다), annoy (짜증 나게 하다), disturb (방해하다)"]], "c": ["(not) bother to do (굳이 ~하다(하지 않다))", "without bothering to do (굳이 ~하지도 않고)"], "s": [["Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.", "아마도 과학자가 할 수 있는 최악의 일은 굳이 확인해 보지도 않고 주어진 시나리오에서 무슨 일이 일어날지 안다고 가정하는 것이다.", "본문", ""], ["Some bees might not bother to make the journey, considering it not worthwhile.", "어떤 벌들은 그 여정이 가치가 없다고 여겨 굳이 그 길을 나서지 않을지도 모른다.", "2024-고2-교육청-9월", ""], ["Most jazz musicians can read music but often don't bother, and their art is much involved with improvisation.", "대부분의 재즈 음악가는 악보를 읽을 수 있지만 흔히 굳이 그렇게 하지 않으며, 그들의 예술은 즉흥 연주와 깊이 관련되어 있다.", "2020-평가원-6월", ""]]}, {"w": "coincide", "ipa": "ˌkoʊɪnˈsaɪd", "m": "ⓥ 동시에 일어나다; 일치하다", "d": [["ⓥ", "to happen at the same time as something else", "다른 일과 같은 때에 일어나다"], ["ⓥ", "to be the same as or match something", "어떤 것과 같거나 일치하다"]], "et": "co (함께) + in (위에) + cadere (떨어지다)", "ex": "함께 떨어지다 → 동시에 일어나다", "g": [["유의어", "correspond (일치하다), match (일치하다)"], ["파생어", "coincidence ⓝ (우연의 일치)"]], "c": ["coincide with A (A와 동시에 일어나다, A와 일치하다)"], "s": [["The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "실험 철학의 부상은 호기심이 의심스러운 속성이 아니라 가치 있는 속성으로 해방된 것과 동시에 일어났다.", "본문", ""], ["As Rudolf Arnheim puts it, “The creative power of the artist can only come into play where reality and the medium of representation do not coincide.”", "Rudolf Arnheim이 말하듯이, \"예술가의 창조적인 힘은 현실과 표현 매체가 일치하지 않는 곳에서만 발휘될 수 있다.\"", "2022-수능", ""]]}, {"w": "liberation", "ipa": "ˌlɪbəˈreɪʃən", "m": "ⓝ 해방, 자유롭게 함", "d": [["ⓝ", "the act of freeing someone or something from control or limits", "통제나 제한에서 누군가나 무언가를 풀어 줌"]], "et": "라틴어 liber (자유로운) + -ation (명사형 어미)", "ex": "자유롭게 함 → 해방", "g": [["유의어", "freedom (자유), release (해방)"], ["파생어", "liberate ⓥ (해방시키다), liberal ⓐ (자유주의의)"]], "c": ["the liberation of A (A의 해방)", "mental liberation (정신적 해방)"], "s": [["The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "실험 철학의 부상은 호기심이 의심스러운 속성이 아니라 가치 있는 속성으로 해방된 것과 동시에 일어났다.", "본문", ""], ["It is the very reverse: mental liberation.", "그것은 정반대, 즉 정신적 해방이다.", "2025-수능", ""]]}, {"w": "curiosity", "ipa": "ˌkjʊriˈɑːsəti", "m": "ⓝ 호기심", "d": [["ⓝ", "the desire to know or learn about something", "무언가를 알거나 배우고 싶은 욕구"]], "et": "라틴어 curiosus (주의 깊은, 알고 싶어 하는) ← cura (관심)", "ex": "알고 싶어 하는 마음", "g": [["유의어", "interest (관심)"], ["반의어", "indifference (무관심)"], ["파생어", "curious ⓐ (호기심이 많은, 궁금한)"]], "c": ["out of curiosity (호기심에서)", "pursue one's curiosity (호기심을 좇다)"], "s": [["The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "실험 철학의 부상은 호기심이 의심스러운 속성이 아니라 가치 있는 속성으로 해방된 것과 동시에 일어났다.", "본문", ""], ["Science works because it is carried out by people who pursue their curiosity about the natural world and test their and each other's ideas from as many varied perspectives and angles as possible.", "과학이 제대로 돌아가는 것은 자연 세계에 대한 호기심을 좇고, 자신과 서로의 생각을 가능한 한 다양한 관점과 각도에서 검증하는 사람들에 의해 수행되기 때문이다.", "2024-고2-교육청-6월", ""], ["When our curiosity leads to something novel, the resulting reward brings us a sense of pleasure.", "우리의 호기심이 새로운 무언가로 이어질 때, 그 결과로 생기는 보상은 우리에게 즐거움을 준다.", "2024-고2-교육청-3월", ""]]}, {"w": "questionable", "ipa": "ˈkwestʃənəbəl", "m": "ⓐ 의심스러운, 문제가 있는", "d": [["ⓐ", "not certain to be true, right, or acceptable", "사실이거나 옳거나 받아들일 만한지 확실하지 않은"]], "et": "question (의문) + -able (~할 수 있는)", "ex": "의문을 제기할 수 있는 → 의심스러운", "g": [["유의어", "doubtful (의심스러운), uncertain (불확실한)"], ["반의어", "certain (확실한), reliable (믿을 수 있는)"], ["파생어", "question ⓝⓥ (질문; 의문을 제기하다)"]], "c": [], "s": [["The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "실험 철학의 부상은 호기심이 의심스러운 속성이 아니라 가치 있는 속성으로 해방된 것과 동시에 일어났다.", "본문", ""], ["From a cross-cultural perspective the equation between public leadership and dominance is questionable.", "문화 간 관점에서 보면, 공적 리더십과 지배를 동일시하는 것은 의심스럽다.", "2021-수능", ""], ["Therefore, having formal limits for responsibility from a specific age that apply to everyone is a somewhat questionable practice.", "그러므로 모든 사람에게 적용되는, 특정 나이부터의 공식적인 책임 한계를 두는 것은 다소 문제가 있는 관행이다.", "2024-고2-교육청-9월", ""]]}, {"w": "attribute", "ipa": "ⓝ ˈætrɪbjuːt ⓥ əˈtrɪbjuːt", "m": "ⓝ 속성, 특성 ⓥ (~의) 탓[덕분]으로 돌리다", "d": [["ⓝ", "a quality or feature that someone or something has", "사람이나 사물이 지닌 특성이나 특징"], ["ⓥ", "to say or believe that something is caused by a particular thing", "어떤 것이 특정한 것에 의해 생겼다고 말하거나 믿다"]], "et": "ad (~에) + tribuere (할당하다, 주다)", "ex": "~에 할당하다 → ~의 것으로 돌리다; 지닌 성질", "g": [["유의어", "quality (특성), trait (특성), characteristic (특징), feature (특징)"]], "c": ["attribute A to B (A를 B의 탓[덕분]으로 돌리다)", "physical attributes (물리적 특성)"], "s": [["The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.", "실험 철학의 부상은 호기심이 의심스러운 속성이 아니라 가치 있는 속성으로 해방된 것과 동시에 일어났다.", "본문", ""], ["In his late twenties, he went to Austria and classified minerals by their physical attributes.", "20대 후반에 그는 오스트리아로 가서 광물을 물리적 특성에 따라 분류했다.", "2025-고2-교육청-3월", ""], ["When he contracts influenza, he never attributes this event to his behavior toward the tax collector or his mother-in-law.", "그는 독감에 걸려도 결코 이 일을 세금 징수원이나 장모에 대한 자신의 행동 탓으로 돌리지 않는다.", "2018-수능", ""]]}, {"w": "assume", "ipa": "əˈsuːm", "m": "ⓥ (사실이라고) 가정하다, 여기다; (책임·역할을) 맡다", "d": [["ⓥ", "to think that something is true without having proof", "증거 없이 어떤 것이 사실이라고 생각하다"], ["ⓥ", "to take on a responsibility or role", "책임이나 역할을 떠맡다"]], "et": "ad (~로) + sumere (취하다)", "ex": "(생각을) 취하다 → 가정하다; (역할을) 떠맡다", "g": [["유의어", "suppose (가정하다), presuppose (전제하다)"], ["파생어", "assumption ⓝ (가정, 추정)"]], "c": ["be assumed to do (~하는 것으로 여겨지다)", "assume a role (역할을 맡다)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["This effort assumes that people can understand the resulting numbers and act on them appropriately.", "이러한 노력은 사람들이 그 결과로 나온 수치를 이해하고 그것에 따라 적절히 행동할 수 있다고 가정한다.", "2019-수능", ""], ["For example, migrants are assumed to overcrowd cities, clog up labor markets, and increase poverty.", "예를 들어, 이주민들은 도시를 과밀하게 만들고, 노동 시장을 막히게 하며, 빈곤을 증가시킨다고 여겨진다.", "2025-고2-교육청-6월", ""]]}, {"w": "philosophical", "ipa": "ˌfɪləˈsɑːfɪkəl", "m": "ⓐ 철학적인, 철학의", "d": [["ⓐ", "relating to philosophy", "철학과 관련된"]], "et": "philo (사랑하는) + sophia (지혜) + -ical (형용사형 어미)", "ex": "지혜를 사랑하는 학문의 → 철학의", "g": [["파생어", "philosophy ⓝ (철학), philosopher ⓝ (철학자), philosophically ad. (철학적으로)"]], "c": ["a philosophical framework (철학적 틀)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["Philip Kitcher and Wesley Salmon have suggested that there are two possible alternatives among philosophical theories of explanation.", "Philip Kitcher와 Wesley Salmon은 설명에 관한 철학 이론들 사이에 두 가지 가능한 대안이 있다고 제시했다.", "2022-수능", ""], ["A conjecture is a philosophical invention, cooked up rather mystically by the mind through the mental computation we call careful contemplation.", "추측은 우리가 신중한 숙고라고 부르는 정신적 계산을 통해 마음이 다소 신비롭게 지어낸 철학적 발명품이다.", "2025-고2-교육청-3월", ""]]}, {"w": "framework", "ipa": "ˈfreɪmwɜːrk", "m": "ⓝ (사고·체계의) 틀, 체계; 뼈대", "d": [["ⓝ", "a set of ideas, rules, or beliefs that is used as a basis for something", "어떤 것의 기초로 쓰이는 일련의 생각·규칙·신념"]], "et": "frame (틀) + work (구조물)", "ex": "틀을 이루는 구조물 → 체계", "g": [["유의어", "structure (구조), system (체계)"], ["관련어", "foundation (토대), principle (원리)"]], "c": ["construct a framework (틀을 구성하다)", "within a framework (틀 안에서)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["Economics, which assumes that actors engage in utility maximization, represents one framework.", "행위자가 효용 극대화에 참여한다고 가정하는 경제학은 하나의 틀을 대표한다.", "2022-평가원-9월", ""], ["They construct frameworks for systematically chosen data in order to provide a consistent and meaningful explanation of what is observed.", "그들은 관찰된 것에 대해 일관되고 의미 있는 설명을 제공하기 위해 체계적으로 선택된 자료를 위한 틀을 구성한다.", "2024-고2-교육청-10월", ""]]}, {"w": "approve", "ipa": "əˈpruːv", "m": "ⓥ 승인하다, 인가하다; 찬성하다", "d": [["ⓥ", "to officially accept a plan, proposal, or request", "계획·제안·요청을 공식적으로 받아들이다"], ["ⓥ", "to think that something is good or acceptable", "어떤 것이 좋거나 받아들일 만하다고 생각하다"]], "et": "ad (~에) + probare (시험하다, 좋다고 인정하다)", "ex": "좋다고 인정하다 → 승인하다", "g": [["유의어", "accept (받아들이다), authorize (인가하다)"], ["반의어", "reject (거부하다)"], ["파생어", "approval ⓝ (승인, 찬성)"]], "c": [], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["Please approve all absences, so that your child will not be at a disadvantage.", "자녀가 불이익을 받지 않도록 모든 결석을 승인해 주십시오.", "2023-고2-교육청-6월", ""], ["As the coordinator, it is becoming apparent to me that the budget, previously approved by your department, needs some adjustments in order to meet the emerging modifications.", "조정자로서, 이전에 귀 부서에서 승인한 예산이 새로 생겨나는 변경 사항에 맞추기 위해 약간의 조정이 필요하다는 것이 저에게 분명해지고 있습니다.", "2024-고2-교육청-10월", ""]]}, {"w": "methodology", "ipa": "ˌmeθəˈdɑːlədʒi", "m": "ⓝ 방법론, (일련의) 방법", "d": [["ⓝ", "a set of methods and principles used in a particular area of study", "특정 연구 분야에서 쓰이는 일련의 방법과 원리"]], "et": "method (방법) + -ology (학문)", "ex": "방법에 관한 체계 → 방법론", "g": [["유의어", "method (방법), approach (접근법), procedure (절차)"], ["파생어", "method ⓝ (방법)"]], "c": ["an approved methodology (공인된 방법론)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["The project manager (or team) can consider different methodologies thereby deciding what works best or what does not work at all.", "프로젝트 관리자(또는 팀)는 여러 방법론을 검토하여 무엇이 가장 효과적이고 무엇이 전혀 효과가 없는지 결정할 수 있다.", "2022-평가원-6월", ""]]}, {"w": "hypothesis", "ipa": "haɪˈpɑːθəsɪs", "m": "ⓝ 가설 (pl. hypotheses)", "d": [["ⓝ", "an idea that is suggested as an explanation but has not yet been proved", "설명으로 제시되었으나 아직 증명되지 않은 생각"]], "et": "hypo (아래에) + thesis (놓음)", "ex": "밑에 놓은 것 → 전제, 가설", "g": [["유의어", "theory (이론), assumption (가정)"], ["관련어", "experiment (실험), evidence (증거)"]], "c": ["prove a hypothesis (가설을 증명하다)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["However, until the hypothesis is tested against reality, it is not yet truly knowledge; it is just information that represents speculation.", "그러나 가설이 현실에 비추어 검증될 때까지 그것은 아직 진정한 지식이 아니라, 추측을 나타내는 정보일 뿐이다.", "2025-고2-교육청-3월", ""], ["The highly respected physicist Enrico Fermi told his students that an experiment that successfully proves a hypothesis is a measurement; one that doesn't is a discovery.", "매우 존경받는 물리학자 Enrico Fermi는 학생들에게 가설을 성공적으로 증명하는 실험은 측정이고, 그렇지 못한 실험은 발견이라고 말했다.", "2019-수능", ""]]}, {"w": "conduct", "ipa": "ⓥ kənˈdʌkt ⓝ ˈkɑːndʌkt", "m": "ⓥ (특정 활동을) 하다, 수행하다; 지휘하다 ⓝ 행동, 처신", "d": [["ⓥ", "to organize and carry out a particular activity", "특정한 활동을 계획하여 실행하다"], ["ⓝ", "the way someone behaves", "누군가가 행동하는 방식"]], "et": "con (함께) + ducere (이끌다)", "ex": "함께 이끌다 → 수행하다, 지휘하다", "g": [["유의어", "carry out (수행하다), perform (실행하다), do (하다)"], ["파생어", "conductor ⓝ (지휘자; 전도체)"]], "c": ["conduct a study[an experiment, a survey] (연구[실험, 설문 조사]를 하다)"], "s": [["For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"", "오늘날 실험 과학은 흔히 철학적 틀과 공인된 방법론('가설을 세운 다음 그것을 검증하라')에 의해 뒷받침된다고 여겨지지만, 사실은 과학철학자 Ian Hacking이 말하듯이 '무슨 일이 일어날지 보려고 그저 호기심에서 실험을 할 수도 있다.'", "본문", ""], ["In 2006, researchers conducted a study on the motivations for helping after the September 11th terrorist attacks against the United States.", "2006년에 연구자들은 9·11 미국 테러 공격 이후 사람들이 도움을 준 동기에 관한 연구를 수행했다.", "2023-고2-교육청-9월", ""], ["Since their introduction, information systems have substantially changed the way business is conducted.", "정보 시스템은 도입된 이래로 사업이 수행되는 방식을 상당히 바꾸어 놓았다.", "2022-수능", ""]]}, {"w": "astronomer", "ipa": "əˈstrɑːnəmər", "m": "ⓝ 천문학자", "d": [["ⓝ", "a scientist who studies the stars, planets, and space", "별·행성·우주를 연구하는 과학자"]], "et": "그리스어 astron (별) + nomos (법칙)", "ex": "별의 법칙을 연구하는 사람", "g": [["파생어", "astronomy ⓝ (천문학)"], ["관련어", "telescope (망원경), universe (우주)"]], "c": [], "s": [["Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless.", "실제로 Charles Darwin의 아들인 천문학자 George Darwin의 견해로는, 비록 성과가 없는 것으로 판명될 가능성이 매우 크더라도 가끔은 완전히 터무니없는 실험을 해 봐야 한다.", "본문", ""], ["Consider also individual astronomers: Their discoveries could not have happened unless centuries of technological development of the telescope and evolving knowledge of the universe had come before them.", "개별 천문학자들도 생각해 보라. 망원경의 수 세기에 걸친 기술 발전과 우주에 대한 지식의 발전이 앞서지 않았다면 그들의 발견은 일어날 수 없었을 것이다.", "2019-평가원-9월", ""]]}, {"w": "fruitless", "ipa": "ˈfruːtləs", "m": "ⓐ 성과 없는, 결실 없는, 헛된", "d": [["ⓐ", "producing no useful results", "유용한 결과를 내지 못하는"]], "et": "fruit (열매, 결실) + -less (~이 없는)", "ex": "결실이 없는", "g": [["유의어", "useless (쓸모없는), unsuccessful (성공하지 못한), in vain (헛되이)"], ["반의어", "fruitful (유익한), productive (생산적인), successful (성공적인)"]], "c": ["prove fruitless (성과가 없는 것으로 판명되다)"], "s": [["Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless.", "실제로 Charles Darwin의 아들인 천문학자 George Darwin의 견해로는, 비록 성과가 없는 것으로 판명될 가능성이 매우 크더라도 가끔은 완전히 터무니없는 실험을 해 봐야 한다.", "본문", ""]]}]}, {"q": "23", "t": "주제", "items": [{"w": "discard", "ipa": "dɪˈskɑːrd", "m": "ⓥ 버리다, 폐기하다", "d": [["ⓥ", "to get rid of something because you no longer want or need it", "더 이상 원하거나 필요하지 않아서 무언가를 없애다"]], "et": "dis (떨어져) + card (카드)", "ex": "(필요 없는) 카드를 내버리다 → 버리다", "g": [["유의어", "throw away (버리다), abandon (버리다), get rid of (없애다), reject (거부하다)"], ["반의어", "keep (보유하다), retain (유지하다)"]], "c": ["discard or replace A (A를 버리거나 대체하다)"], "s": [["We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 대체할 수 있다.", "본문", ""], ["In turn, they may later be discarded as the demands of present societies change, or even, as is presently occurring in the former Eastern Europe, when pasts have to be reinvented to reflect new presents.", "이번에는 그것들이 나중에, 현재 사회의 요구가 바뀌면서, 또는 심지어 지금 옛 동유럽에서 일어나고 있듯이 새로운 현재를 반영하기 위해 과거를 다시 만들어 내야 할 때 버려질 수도 있다.", "2019-수능", ""]]}, {"w": "replace", "ipa": "rɪˈpleɪs", "m": "ⓥ 대체하다, 대신하다; 교체하다", "d": [["ⓥ", "to take the place of something or someone", "무언가나 누군가의 자리를 대신하다"], ["ⓥ", "to put something new in the place of something old", "오래된 것 자리에 새것을 놓다"]], "et": "re (다시) + place (놓다)", "ex": "다시 그 자리에 놓다 → 대신하다", "g": [["유의어", "substitute (대신하다), displace (대체하다)"], ["파생어", "replacement ⓝ (대체(물), 교체)"]], "c": ["replace A with B (A를 B로 대체하다)"], "s": [["We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 대체할 수 있다.", "본문", ""], ["Today automation has eliminated all but 1 percent of their jobs, replacing them with machines.", "오늘날 자동화는 그들의 일자리 중 1퍼센트를 제외한 전부를 없애고 그것들을 기계로 대체했다.", "2024-고2-교육청-6월", ""], ["Computer companies have even begun to advertise ways in which computers can replace parents.", "컴퓨터 회사들은 심지어 컴퓨터가 부모를 대신할 수 있는 방법들을 광고하기 시작했다.", "2022-평가원-9월", ""]]}, {"w": "theory", "ipa": "ˈθiːəri", "m": "ⓝ 이론, 학설", "d": [["ⓝ", "a set of ideas that is intended to explain why something happens or exists", "어떤 일이 왜 일어나거나 존재하는지 설명하려는 일련의 생각"]], "et": "그리스어 theoria (바라봄, 고찰)", "ex": "관찰하여 세운 생각 → 이론", "g": [["유의어", "hypothesis (가설)"], ["반의어", "practice (실제, 실천)"], ["파생어", "theoretical ⓐ (이론적인)"]], "c": ["the theory of A (A의 이론)", "develop a theory (이론을 개발하다)"], "s": [["We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 대체할 수 있다.", "본문", ""], ["It is what is left over after cycles of experimental testing have eliminated false theories.", "그것은 반복된 실험적 검증이 잘못된 이론들을 제거한 뒤에 남은 것이다.", "2025-고2-교육청-3월", ""], ["If multicelled organisms were indeed found to have evolved before single-celled organisms, then the theory of evolution would be rejected.", "만약 다세포 생물이 정말로 단세포 생물보다 먼저 진화했다는 것이 밝혀진다면, 진화론은 거부될 것이다.", "2023-평가원-6월", ""]]}, {"w": "evidence", "ipa": "ˈevɪdəns", "m": "ⓝ 증거, 근거", "d": [["ⓝ", "facts or signs that show that something is true or exists", "어떤 것이 사실이거나 존재함을 보여 주는 사실이나 징후"]], "et": "e(x) (밖으로) + videre (보다)", "ex": "밖으로 드러나 보이는 것 → 증거", "g": [["유의어", "data (자료), sign (징후), indication (징후, 표시)"], ["파생어", "evident ⓐ (분명한)"]], "c": ["evidence that S V (~라는 증거)", "a body of evidence (많은 증거)"], "s": [["We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.", "우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 대체할 수 있다.", "본문", ""], ["If the evidence indicates that the charity is really helping others, they make a substantial donation.", "증거가 그 자선 단체가 정말로 다른 사람들을 돕고 있다는 것을 보여 주면, 그들은 상당한 금액을 기부한다.", "2018-수능", ""], ["There is evidence that even very simple algorithms can outperform expert judgement on simple prediction problems.", "아주 단순한 알고리즘조차 간단한 예측 문제에서는 전문가의 판단보다 더 나은 성과를 낼 수 있다는 증거가 있다.", "2023-수능", ""]]}, {"w": "vast", "ipa": "væst", "m": "ⓐ 방대한, 막대한, 광대한", "d": [["ⓐ", "extremely large in size, amount, or degree", "크기·양·정도가 매우 큰"]], "et": "라틴어 vastus (텅 빈, 광대한)", "ex": "끝없이 넓은 → 방대한", "g": [["유의어", "huge (거대한), enormous (막대한), immense (엄청난), massive (거대한)"], ["반의어", "tiny (아주 작은)"], ["파생어", "vastly ad. (엄청나게, 대단히)"]], "c": ["a vast amount[number] of A (방대한 양[수]의 A)"], "s": [["A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "방대한 양의 증거가 Newton의 중력 이론을 뒷받침하지만, 19세기 후반 무렵 과학자들은 그 이론의 예측이 관측과 완벽하게 일치하지 않는 사례들을 발견하기 시작했다.", "본문", ""], ["When they saw the cabbage patch, they suddenly remembered how vast it was.", "그들은 양배추밭을 보았을 때, 그것이 얼마나 광대했는지 갑자기 떠올렸다.", "2019-수능", ""], ["Brains are behavioural organs, and behavioural adaptation, being immediate and non-random, is vastly more efficient than genetic adaptation.", "뇌는 행동 기관이며, 행동 적응은 즉각적이고 무작위적이지 않아서 유전적 적응보다 훨씬 더 효율적이다.", "2021-평가원-6월", ""]]}, {"w": "body", "ipa": "ˈbɑːdi", "m": "ⓝ (많은) 양, 모음; 신체; 단체; 물체", "d": [["ⓝ", "a large amount or collection of something", "어떤 것의 많은 양이나 모음"], ["ⓝ", "the physical structure of a person or animal", "사람이나 동물의 신체 구조"]], "et": "고대 영어 bodig (몸통)", "ex": "몸 → 몸체, 덩어리 → (많은) 양", "g": [["유의어", "collection (모음), mass (덩어리)"], ["파생어", "bodily ⓐ (신체의)"]], "c": ["a (considerable) body of evidence (상당한 양의 증거)", "a body of water (수역)"], "s": [["A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "방대한 양의 증거가 Newton의 중력 이론을 뒷받침하지만, 19세기 후반 무렵 과학자들은 그 이론의 예측이 관측과 완벽하게 일치하지 않는 사례들을 발견하기 시작했다.", "본문", ""], ["Charles and Carstensen review a considerable body of evidence indicating that, as people get older, they tend to prioritize close social relationships, focus more on achieving emotional well-being, and attend more to positive emotional information while ignoring negative information.", "Charles와 Carstensen은 사람들이 나이가 들수록 가까운 사회적 관계를 우선시하고, 정서적 행복을 이루는 데 더 집중하며, 긍정적인 정서 정보에 더 주의를 기울이고 부정적인 정보는 무시하는 경향이 있음을 보여 주는 상당한 양의 증거를 검토한다.", "2022-평가원-6월", ""], ["One is the view that scientific explanation consists in the unification of broad bodies of phenomena under a minimal number of generalizations.", "하나는 과학적 설명이 광범위한 현상의 집합을 최소한의 일반화 아래 통합하는 데 있다는 견해이다.", "2022-수능", ""]]}, {"w": "gravity", "ipa": "ˈɡrævəti", "m": "ⓝ 중력; 중대성, 심각성", "d": [["ⓝ", "the force that pulls objects toward each other, especially toward the Earth", "물체를 서로, 특히 지구 쪽으로 끌어당기는 힘"], ["ⓝ", "seriousness or importance", "심각성이나 중요성"]], "et": "라틴어 gravis (무거운) + -ity (명사형 어미)", "ex": "무거움 → 중력; 중대함", "g": [["관련어", "force (힘), weight (무게)"]], "c": ["the theory of gravity (중력 이론)", "the pull of gravity (중력의 당김)"], "s": [["A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "방대한 양의 증거가 Newton의 중력 이론을 뒷받침하지만, 19세기 후반 무렵 과학자들은 그 이론의 예측이 관측과 완벽하게 일치하지 않는 사례들을 발견하기 시작했다.", "본문", ""], ["We don't normally see this lensing because stars aren't visible during the day when the Sun is out, but a solar eclipse in 1919 allowed scientists to observe what the Sun's gravity was doing to the light from distant stars.", "태양이 떠 있는 낮에는 별이 보이지 않기 때문에 우리는 보통 이러한 (중력) 렌즈 현상을 보지 못하지만, 1919년의 일식 덕분에 과학자들은 태양의 중력이 먼 별에서 오는 빛에 무슨 작용을 하는지 관찰할 수 있었다.", "2025-고2-교육청-9월", ""], ["It works like this: As the glaciers melt and the seas rise, gravity forces more water toward the equator.", "그것은 이렇게 작동한다. 빙하가 녹고 해수면이 상승하면 중력이 더 많은 물을 적도 쪽으로 밀어 보낸다.", "2022-고1-교육청-11월", ""]]}, {"w": "prediction", "ipa": "prɪˈdɪkʃən", "m": "ⓝ 예측, 예언", "d": [["ⓝ", "a statement about what will happen in the future", "미래에 무슨 일이 일어날지에 대한 진술"]], "et": "pre (미리) + dict (말하다) + -ion (명사형 어미)", "ex": "미리 말함 → 예측", "g": [["유의어", "forecast (예보, 예측), expectation (예상)"], ["파생어", "predict ⓥ (예측하다), predictable ⓐ (예측 가능한), unpredictable ⓐ (예측할 수 없는)"]], "c": ["make a prediction (예측하다)"], "s": [["A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.", "방대한 양의 증거가 Newton의 중력 이론을 뒷받침하지만, 19세기 후반 무렵 과학자들은 그 이론의 예측이 관측과 완벽하게 일치하지 않는 사례들을 발견하기 시작했다.", "본문", ""], ["Apart from demonstrating that evolution did occur, the fossil record also provides tests of the predictions made from evolutionary theory.", "화석 기록은 진화가 실제로 일어났음을 보여 주는 것 외에도, 진화론에서 나온 예측들을 검증할 수단도 제공한다.", "2023-평가원-6월", ""], ["Newton's theory makes no such prediction.", "Newton의 이론은 그러한 예측을 전혀 하지 않는다.", "2025-고2-교육청-9월", ""]]}, {"w": "match", "ipa": "mætʃ", "m": "ⓥ (~와) 일치하다, 부합하다; 필적하다; 짝을 맞추다 ⓝ 경기, 시합", "d": [["ⓥ", "to be the same as or very similar to something", "어떤 것과 같거나 매우 비슷하다"], ["ⓥ", "to be as good as something else", "다른 것만큼 좋다"]], "et": "고대 영어 gemæcca (짝, 동료)", "ex": "짝이 되다 → 일치하다, 필적하다", "g": [["유의어", "correspond to (~와 일치하다), fit (맞다), equal (~에 필적하다)"], ["관련어", "mismatch (불일치)"]], "c": ["match A to B (A를 B에 맞추다)", "match the observations (관측 결과와 일치하다)"], "s": [["These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.", "이러한 불일치는 Einstein이 일반 상대성 이론을 개발하고 나서야 설명되었는데, 그 이론은 관측 결과와 일치할 수 있었다.", "본문", ""], ["Participants then had to match the figure to a background varying from dark to light red.", "그런 다음 참가자들은 그 도형을 어두운 빨간색에서 밝은 빨간색까지 다양한 배경에 맞춰야 했다.", "2024-고2-교육청-10월", ""], ["Rather, organisms come to match their environments by being 'the fittest available' or 'the fittest yet': they are not 'the best imaginable'.", "오히려 생물은 '이용 가능한 것 중 가장 적합한 것' 또는 '지금까지 중 가장 적합한 것'이 됨으로써 환경에 맞춰지게 되는 것이지, '상상할 수 있는 최고의 것'이 되는 것은 아니다.", "2024-평가원-6월", ""]]}, {"w": "observation", "ipa": "ˌɑːbzərˈveɪʃən", "m": "ⓝ 관찰, 관측; 관찰 결과; 의견", "d": [["ⓝ", "the act of watching something carefully to learn about it", "무언가를 알기 위해 주의 깊게 지켜보는 행위"], ["ⓝ", "information gained by watching something", "무언가를 지켜보아 얻은 정보"]], "et": "ob (~을 향해) + servare (지켜보다) + -ation (명사형 어미)", "ex": "주의 깊게 지켜봄 → 관찰", "g": [["유의어", "examination (조사), monitoring (관찰, 감시)"], ["파생어", "observe ⓥ (관찰하다; 준수하다), observer ⓝ (관찰자)"]], "c": ["make an observation (관찰하다; 의견을 말하다)"], "s": [["These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.", "이러한 불일치는 Einstein이 일반 상대성 이론을 개발하고 나서야 설명되었는데, 그 이론은 관측 결과와 일치할 수 있었다.", "본문", ""], ["Environmental learning occurs when farmers base decisions on observations of \"payoff\" information.", "환경 학습은 농부들이 '보상' 정보에 대한 관찰에 근거하여 결정을 내릴 때 일어난다.", "2023-평가원-9월", ""], ["In order to achieve perspective, you must make a number of observations.", "전체적인 관점을 얻기 위해서는 여러 번 관찰해야 한다.", "2025-고2-교육청-6월", ""]]}, {"w": "discrepancy", "ipa": "dɪˈskrepənsi", "m": "ⓝ 불일치, 차이", "d": [["ⓝ", "a difference between two things that should be the same", "같아야 할 두 가지 사이의 차이"]], "et": "dis (따로) + crepare (소리 나다)", "ex": "서로 다른 소리를 내다 → 불일치", "g": [["유의어", "difference (차이), gap (격차), mismatch (불일치)"], ["반의어", "agreement (일치), consistency (일관성)"]], "c": [], "s": range of A (광범위한 A)", "broad categories (넓은 범주)"], "s": [["It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.", "Einstein의 이론은 그렇게 했고, 그래서 우리는 이제 그것을 Newton의 이론보다 더 폭넓은 중력 이론으로 여긴다.", "본문", ""], ["Philosophy allows us to ask much broader questions than many other scientific disciplines.", "철학은 우리가 다른 많은 과학 분야보다 훨씬 더 폭넓은 질문을 던질 수 있게 해 준다.", "2026-수능", ""], ["Further, more diverse communities are believed to be more stable because they use a broader range of niches than species-poor communities.", "게다가 더 다양한 군집은 종이 빈약한 군집보다 더 넓은 범위의 생태적 지위를 이용하기 때문에 더 안정적이라고 여겨진다.", "2020-수능", ""]]}, {"w": "seek", "ipa": "siːk", "m": "ⓥ (sought-sought) 찾다, 구하다; 추구하다; ~하려고 애쓰다", "d": [["ⓥ", "to try to find or get something", "무언가를 찾거나 얻으려고 노력하다"], ["ⓥ", "to try to do something", "무언가를 하려고 애쓰다"]], "et": "고대 영어 secan (찾다, 구하다)", "ex": "찾아 나서다", "g": [["유의어", "look for (찾다), search for (찾다), pursue (추구하다)"]], "c": ["seek shelter[help] (피난처[도움]를 구하다)", "seek to do (~하려고 애쓰다)", "seek out (찾아내다)"], "s": [["Some scientists today are seeking a theory of gravity that will go beyond Einstein's.", "오늘날 일부 과학자들은 Einstein의 이론을 넘어설 중력 이론을 찾고 있다.", "본문", ""], ["The reality, however, is more complex, and many migrants are simply seeking greater economic opportunity.", "그러나 현실은 더 복잡하며, 많은 이주민들은 그저 더 큰 경제적 기회를 찾고 있을 뿐이다.", "2025-고2-교육청-6월", ""], ["In some cases, when an individual detects a predator, its best response is to seek shelter.", "어떤 경우에는 한 개체가 포식자를 감지했을 때, 그것의 최선의 반응은 피난처를 찾는 것이다.", "2023-평가원-6월", ""]]}, {"w": "beyond", "ipa": "bɪˈjɑːnd", "m": "prep. ~을 넘어서, ~ 이상으로; ~의 범위를 벗어나", "d": [["prep.", "further than a particular limit, level, or place", "특정한 한계·수준·장소보다 더 멀리"]], "et": "be (~에서) + geond (저편)", "ex": "저편에 → ~을 넘어서", "g": [["관련어", "exceed (넘다), surpass (능가하다)"]], "c": ["go beyond A (A를 넘어서다)", "beyond the boundaries of A (A의 경계를 넘어)"], "s": [["Some scientists today are seeking a theory of gravity that will go beyond Einstein's.", "오늘날 일부 과학자들은 Einstein의 이론을 넘어설 중력 이론을 찾고 있다.", "본문", ""], ["You have to venture beyond the boundaries of your current experience and explore new territory.", "여러분은 현재 경험의 경계를 넘어서 모험하며 새로운 영역을 탐험해야 한다.", "2018-수능", ""], ["But if we only go where we feel confident, then confidence never expands beyond that.", "그러나 우리가 자신 있다고 느끼는 곳에만 간다면, 자신감은 결코 그 이상으로 커지지 않는다.", "2024-평가원-9월", ""]]}, {"w": "realm", "ipa": "relm", "m": "ⓝ 영역, 분야; 왕국", "d": [["ⓝ", "an area of knowledge, activity, or interest", "지식·활동·관심의 영역"]], "et": "고대 프랑스어 reaume (왕국) ← 라틴어 regimen (통치)", "ex": "통치하는 범위 → 영역", "g": [["유의어", "area (분야), field (분야), domain (영역), sphere (영역)"]], "c": ["in the realm of A (A의 영역에서)"], "s": [["If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.", "어떤 새로운 이론이 언젠가 인정을 받으려면, 그것은 Einstein 이론의 모든 성공에 필적해야 할 뿐 아니라 Einstein의 이론이 통하지 않는 새로운 영역에서도 작동해야 할 것이다.", "본문", ""], ["Tourism takes place simultaneously in the realm of the imagination and that of the physical world.", "관광은 상상의 영역과 물리적 세계의 영역에서 동시에 일어난다.", "2019-평가원-6월", ""], ["But art can also carry aesthetic value, which elevates the job of evaluation into another realm.", "그러나 예술은 미적 가치도 지닐 수 있는데, 이것은 평가 작업을 또 다른 영역으로 끌어올린다.", "2021-평가원-9월", ""]]}]}, {"q": "24", "t": "제목", "items": [{"w": "refresh", "ipa": "rɪˈfreʃ", "m": "ⓥ 상쾌하게 하다, 기운을 되찾게 하다; (기억 등을) 새롭게 하다", "d": [["ⓥ", "to make someone feel less tired or less hot", "누군가를 덜 피곤하거나 덜 덥게 느끼게 하다"]], "et": "re (다시) + fresh (신선한)", "ex": "다시 신선하게 하다", "g": [["유의어", "revive (되살리다), restore (회복시키다), recharge (재충전하다)"], ["파생어", "refreshing ⓐ (상쾌하게 하는), refreshment ⓝ (다과, 원기 회복)"]], "c": ["refresh one's mind (머리를 식히다)", "a refreshing cup of tea (상쾌한 차 한 잔)"], "s": [["Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy.", "바쁜 하루의 한가운데에서 잠시 멈추고, 잠깐 시간을 내어 마음을 상쾌하게 하고 에너지를 재충전한다고 상상해 보라.", "본문", ""], ["Come and enjoy ⓝ (판에 박힌) 일상, 일과; 틀 ⓐ 일상적인, 판에 박힌", "d": [["ⓝ", "the usual order and way in which you regularly do things", "평소에 규칙적으로 일을 하는 순서와 방식"], ["ⓐ", "done as a normal part of a job or process", "일이나 과정의 일반적인 부분으로 행해지는"]], "et": "프랑스어 route (길) + -ine (명사형 어미)", "ex": "늘 다니는 작은 길 → 일상, 일과", "g": [["유의어", "habit (습관), custom (관습), regular (규칙적인), everyday (일상의)"], ["반의어", "unusual (특이한)"], ["파생어", "routinely ad. (일상적으로, 늘)"]], "c": ["break away from routine (일상에서 벗어나다)", "daily[everyday] routine (일상)"], "s": [["When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "일상에서 벗어날 때, 특히 뇌를 자극하도록 고안된 활동으로 그렇게 할 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높이게 된다.", "본문", ""], ["Think of events that shake you out of your everyday routine: maybe attending a family wedding, making a big presentation, or going somewhere you've never been.", "여러분을 평소의 일상에서 흔들어 벗어나게 하는 일들을 생각해 보라. 아마 가족 결혼식에 참석하는 것, 중요한 발표를 하는 것, 또는 한 번도 가 본 적 없는 곳에 가는 것일 것이다.", "2025-고2-교육청-9월", ""], ["The preindustrial blacksmith made things to order for people in his immediate community; customizing the product, modifying or transforming it according to the user, was routine.", "산업화 이전의 대장장이는 바로 가까운 공동체 사람들을 위해 주문에 따라 물건을 만들었는데, 사용자에 맞춰 제품을 맞춤 제작하고 수정하거나 변형하는 것은 일상적인 일이었다.", "2022-수능", ""]]}, {"w": "stimulate", "ipa": "ˈstɪmjuleɪt", "m": "ⓥ 자극하다, 활발하게 하다, 촉진하다", "d": [["ⓥ", "to make something more active or make it develop or grow", "어떤 것을 더 활발하게 하거나 발달·성장하게 하다"]], "et": "라틴어 stimulus (가축을 몰던 뾰족한 막대)", "ex": "막대로 찔러 움직이게 하다 → 자극하다", "g": [["유의어", "encourage (촉진하다), activate (활성화하다), boost (북돋우다), trigger (유발하다)"], ["반의어", "discourage (억제하다), inhibit (억제하다)"], ["파생어", "stimulus ⓝ (자극), stimulation ⓝ (자극)"]], "c": ["stimulate growth[the brain] (성장[뇌]을 자극하다)"], "s": [["When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "일상에서 벗어날 때, 특히 뇌를 자극하도록 고안된 활동으로 그렇게 할 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높이게 된다.", "본문", ""], ["This functioned to clear woody vegetation and also stimulated new plant growth in the following spring.", "이것은 목본 식물을 제거하는 기능을 했으며, 이듬해 봄에는 새로운 식물의 성장을 촉진하기도 했다.", "2025-평가원-6월", ""], ["Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations.", "예를 들어, 거리에서 보이는 태양광 패널은 이웃의 (태양광 패널) 설치를 자극할 가능성이 더 크다.", "2024-고2-교육청-9월", ""]]}, {"w": "cognitive", "ipa": "ˈkɑːɡnətɪv", "m": "ⓐ 인지의, 인식의", "d": [["ⓐ", "connected with thinking, understanding, learning, and remembering", "생각·이해·학습·기억과 관련된"]], "et": "co (완전히) + gnoscere (알다) + -ive (형용사형 어미)", "ex": "앎에 관련된 → 인지의", "g": [["유의어", "mental (정신의), intellectual (지적인)"], ["파생어", "cognition ⓝ (인지), cognitively ad. (인지적으로)"]], "c": ["cognitive ability[capability] (인지 능력)", "cognitive load (인지 부하)"], "s": [["When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "일상에서 벗어날 때, 특히 뇌를 자극하도록 고안된 활동으로 그렇게 할 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높이게 된다.", "본문", ""], ["This implies that the cognitive association of objects to color influences how we perceive that color.", "이는 물체와 색의 인지적 연관이 우리가 그 색을 지각하는 방식에 영향을 준다는 것을 암시한다.", "2024-고2-교육청-10월", ""], ["Self-driving cars, where a person turns on and off the driving, is an example of a joint cognitive system.", "사람이 운전 기능을 켜고 끄는 자율 주행차는 공동 인지 시스템의 한 예이다.", "2023-평가원-6월", ""]]}, {"w": "enhance", "ipa": "ɪnˈhæns", "m": "ⓥ 높이다, 향상시키다, 강화하다", "d": [["ⓥ", "to improve the quality, amount, or strength of something", "어떤 것의 질·양·강도를 개선하다"]], "et": "en (~하게 하다) + altus (높은)", "ex": "높게 하다 → 향상시키다", "g": [["유의어", "improve (개선하다), boost (높이다), strengthen (강화하다), increase (증가시키다)"], ["반의어", "reduce (줄이다), weaken (약화시키다), diminish (감소시키다)"], ["파생어", "enhancement ⓝ (향상)"]], "c": ["enhance productivity[performance] (생산성[성과]을 높이다)"], "s": [["When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "일상에서 벗어날 때, 특히 뇌를 자극하도록 고안된 활동으로 그렇게 할 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높이게 된다.", "본문", ""], ["We believe your continued involvement will further enhance our students' learning experience and academic achievement.", "귀하의 지속적인 참여가 우리 학생들의 학습 경험과 학업 성취를 더욱 향상시킬 것이라 믿습니다.", "2025-고2-교육청-6월", ""], ["But the popularization of science would be greatly enhanced by improving the widespread images of the scientist.", "그러나 과학자에 대해 널리 퍼져 있는 이미지를 개선한다면 과학의 대중화가 크게 향상될 것이다.", "2022-평가원-6월", ""]]}, {"w": "productivity", "ipa": "ˌproʊdʌkˈtɪvəti", "m": "ⓝ 생산성", "d": [["ⓝ", "the rate at which a person, machine, or organization produces things", "사람·기계·조직이 무언가를 생산하는 비율"]], "et": "pro (앞으로) + ducere (이끌다) → productive + -ity (명사형 어미)", "ex": "앞으로 이끌어 내는 능력 → 생산성", "g": [["유의어", "efficiency (효율성), output (생산량)"], ["파생어", "productive ⓐ (생산적인), produce ⓥ (생산하다)"]], "c": ["increase[decrease] productivity (생산성을 높이다[낮추다])"], "s": [["When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.", "일상에서 벗어날 때, 특히 뇌를 자극하도록 고안된 활동으로 그렇게 할 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높이게 된다.", "본문", ""], ["Labor, previously guided by harvest cycles, became clock-oriented, and society started to reorganize around new principles of productivity.", "이전에는 수확 주기에 따라 이루어지던 노동이 시계 중심이 되었고, 사회는 생산성이라는 새로운 원칙을 중심으로 재편되기 시작했다.", "2025-수능", ""], ["In such cases creativity may actually decrease productivity (as measured by publication counts) because effort is focused on difficult problems.", "그러한 경우에는 노력이 어려운 문제에 집중되기 때문에, 창의성이 실제로 (출판물 수로 측정되는) 생산성을 떨어뜨릴 수도 있다.", "2023-고2-교육청-3월", ""]]}, {"w": "agile", "ipa": "ˈædʒəl", "m": "ⓐ 민첩한, 기민한", "d": [["ⓐ", "able to move or think quickly and easily", "빠르고 쉽게 움직이거나 생각할 수 있는"]], "et": "라틴어 agilis (움직이기 쉬운) ← agere (움직이다)", "ex": "잘 움직이는 → 민첩한", "g": [["유의어", "quick (빠른), alert (기민한), flexible (유연한)"], ["반의어", "slow (느린), clumsy (서투른)"]], "c": [], "s": [["They target different areas of your brain, keeping it agile and alert.", "그것들은 뇌의 여러 영역을 겨냥하여 뇌를 기민하고 맑게 깨어 있는 상태로 유지해 준다.", "본문", ""]]}, {"w": "alert", "ipa": "əˈlɜːrt", "m": "ⓐ 기민한, 정신이 맑은; 경계하는 ⓝ 경보 ⓥ (위험 등을) 알리다", "d": [["ⓐ", "able to think quickly and notice things", "빠르게 생각하고 사물을 알아차릴 수 있는"], ["ⓥ", "to warn someone of a danger or problem", "누군가에게 위험이나 문제를 경고하다"]], "et": "이탈리아어 all'erta (망루 위에서, 경계하여)", "ex": "높은 곳에서 지켜보는 → 경계하는, 기민한", "g": [["유의어", "attentive (주의 깊은), aware (의식하는), awake (깨어 있는), warn (경고하다)"]], "c": ["keep[stay] alert (정신을 바짝 차리다)", "alert A to B (A에게 B를 알리다)"], "s": [["They target different areas of your brain, keeping it agile and alert.", "그것들은 뇌의 여러 영역을 겨냥하여 뇌를 기민하고 맑게 깨어 있는 상태로 유지해 준다.", "본문", ""], ["We expect people to monitor machines, which means keeping alert for long periods, something we are bad at.", "우리는 사람들이 기계를 감시하기를 기대하는데, 이는 오랜 시간 동안 정신을 바짝 차리고 있어야 한다는 뜻이며, 그것은 우리가 잘 못하는 일이다.", "2021-수능", ""], ["Note taking helps to keep you active and alert; it allows you to impose some organization on the discussion; and it can prepare you to speak.", "필기는 여러분이 능동적이고 정신이 맑은 상태를 유지하도록 돕고, 토론에 어느 정도 체계를 부여할 수 있게 해 주며, 말할 준비를 하게 해 줄 수 있다.", "2026-평가원-6월", ""]]}, {"w": "oasis", "ipa": "oʊˈeɪsɪs", "m": "ⓝ 오아시스; (괴로움 속의) 휴식처, 위안", "d": [["ⓝ", "a pleasant place or period that is different from the stressful things around it", "주변의 스트레스와 달리 즐거운 장소나 시간"], ["ⓝ", "a place in a desert with water and plants", "물과 식물이 있는 사막의 한 장소"]], "et": "그리스어 oasis ← 이집트어 (비옥한 땅)", "ex": "사막 속 쉼터", "g": [["유의어", "haven (안식처)"]], "c": ["a mental oasis (정신적 오아시스)"], "s": [["These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges.", "이 운동들은 여러분을 상쾌하게 하고 오후의 도전에 대비하게 해 주는 정신적 오아시스를 만들어 준다.", "본문", ""]]}, {"w": "strategic", "ipa": "strəˈtiːdʒɪk", "m": "ⓐ 전략적인, 전략상의", "d": [["ⓐ", "carefully planned in order to achieve a particular goal", "특정한 목표를 이루기 위해 신중하게 계획된"]], "et": "그리스어 strategos (장군) + -ic (형용사형 어미)", "ex": "장군의 (작전) → 전략적인", "g": [["유의어", "planned (계획된), calculated (계산된), deliberate (의도적인)"], ["파생어", "strategy ⓝ (전략), strategically ad. (전략적으로)"]], "c": ["a strategic mistake (전략적 실수)"], "s": [["This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.", "이 전략적인 멈춤은 단순한 휴식이 아니다. 그것은 여러분의 인지 능력을 높여 주어 정신이 확실히 예리하고 집중된 상태로 유지되게 한다.", "본문", ""], ["It is a strategic and tactical mistake to give an offensive position away to those who will use it to attack, criticize, and blame.", "공격하고 비판하고 비난하는 데 그것을 이용할 사람들에게 공격적인 위치를 내주는 것은 전략적·전술적 실수이다.", "2018-평가원-6월", ""], ["Some of the most insightful work on information seeking emphasizes \"strategic self-ignorance,\" understood as \"the use of ignorance as an excuse to engage excessively in pleasurable activities that may be harmful to one's future self.\"", "정보 탐색에 관한 가장 통찰력 있는 연구 중 일부는 '전략적 자기 무지', 즉 '미래의 자신에게 해로울 수 있는 즐거운 활동에 지나치게 빠지기 위한 핑계로 무지를 이용하는 것'을 강조한다.", "2022-평가원-6월", ""]]}, {"w": "boost", "ipa": "buːst", "m": "ⓥ 높이다, 북돋우다, 늘리다 ⓝ 증가, 부양; 격려", "d": [["ⓥ", "to make something increase or become better", "어떤 것을 늘리거나 더 좋아지게 하다"], ["ⓝ", "something that helps or encourages", "돕거나 격려하는 것"]], "et": "미국 영어 boost (밀어 올리다)", "ex": "위로 밀어 올리다 → 높이다", "g": [["유의어", "increase (늘리다), enhance (향상시키다), improve (개선하다), raise (높이다)"], ["반의어", "reduce (줄이다), lower (낮추다)"], ["파생어", "booster ⓝ (촉진제, 높여 주는 것)"]], "c": ["boost sales (판매를 늘리다)", "give a boost to A (A를 북돋우다)"], "s": [["This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.", "이 전략적인 멈춤은 단순한 휴식이 아니다. 그것은 여러분의 인지 능력을 높여 주어 정신이 확실히 예리하고 집중된 상태로 유지되게 한다.", "본문", ""], ["The printing press boosted the power of ideas to copy themselves.", "인쇄기는 생각이 스스로 re, it requires differential treatment.", "후자가 관련이 없을 때 평등은 균일하거나 동일한 대우를 수반하고, 관련이 있을 때는 차등적인 대우를 요구한다.", "2021-평가원-9월", ""]]}, {"w": "occasion", "ipa": "əˈkeɪʒən", "m": "ⓝ (특정한) 때, 경우; 행사; 기회", "d": [["ⓝ", "a time when something happens", "어떤 일이 일어나는 때"], ["ⓝ", "a special event or celebration", "특별한 행사나 축하"]], "et": "ob (~쪽으로) + cadere (떨어지다)", "ex": "(때가) 떨어져 닥침 → 경우, 때", "g": [["유의어", "instance (경우), case (경우), opportunity (기회), event (행사)"], ["파생어", "occasional ⓐ (가끔의), occasionally ad. (가끔)"]], "c": ["on rare occasions (드물게)"], "s": [["On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.", "드물게 그 오류는 더 나은 쪽으로의 변화일 수도 있지만, 더 그럴 법하게는 세포의 앞날에 아무런 중대한 차이도 일으키지 않을 것이다.", "본문", ""], ["Suddenly, you judge everyone from the university by what you've experienced on just a few unfortunate occasions.", "갑자기 여러분은 단지 몇 번의 불운한 경우에 겪은 일로 그 대학의 모든 사람을 판단한다.", "2026-수능", ""], ["Trends constantly suggest new opportunities for individuals to restage themselves, representing occasions for change.", "유행은 개인이 자신을 새롭게 연출할 새로운 기회를 끊임없이 제시하며, 변화의 계기가 된다.", "2023-수능", ""]]}, {"w": "significant", "ipa": "sɪɡˈnɪfɪkənt", "m": "ⓐ 중대한, 의미 있는, 상당한", "d": [["ⓐ", "large or important enough to have an effect or be noticed", "영향을 미치거나 주목받을 만큼 크거나 중요한"]], "et": "signum (표시) + facere (만들다) + -ant (형용사형 어미)", "ex": "표시를 남길 만한 → 중요한", "g": [["유의어", "important (중요한), considerable (상당한), substantial (상당한), meaningful (의미 있는)"], ["반의어", "insignificant (사소한), minor (사소한), trivial (사소한)"], ["파생어", "significance ⓝ (중요성), significantly ad. (상당히)"]], "c": ["a significant difference[effect] (중대한 차이[영향])", "play a significant role (중요한 역할을 하다)"], "s": [["On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.", "드물게 그 오류는 더 나은 쪽으로의 변화일 수도 있지만, 더 그럴 법하게는 세포의 앞날에 아무런 중대한 차이도 일으키지 않을 것이다.", "본문", ""], ["What a work of art is titled, on the other hand, has a significant effect on the aesthetic face it presents and on the qualities we correctly perceive in it.", "반면에 예술 작품에 어떤 제목이 붙는지는 그것이 보여 주는 미적 면모와 우리가 그 안에서 올바르게 지각하는 특성에 상당한 영향을 미친다.", "2021-평가원-9월", ""], ["The changing climate can have a significant impact on the production and availability of spices, influencing their growth patterns and ultimately affecting global spice markets.", "기후 변화는 향신료의 생산과 공급에 상당한 영향을 미쳐, 향신료의 생장 패턴에 영향을 주고 결국 세계 향신료 시장에 영향을 미칠 수 있다.", "2024-고2-교육청-3월", ""]]}, {"w": "prospect", "ipa": "ˈprɑːspekt", "m": "ⓝ (성공의) 가망, 전망, 앞날", "d": [["ⓝ", "the chances of success or of something good happening in the future", "미래에 성공하거나 좋은 일이 일어날 가능성"]], "et": "pro (앞으로) + specere (보다)", "ex": "앞을 내다봄 → 전망", "g": [["유의어", "outlook (전망), chance (가능성), possibility (가능성), future (앞날)"], ["파생어", "prospective ⓐ (장래의, 유망한)"]], "c": ["prospects are poor (전망이 어둡다)"], "s": [["On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.", "드물게 그 오류는 더 나은 쪽으로의 변화일 수도 있지만, 더 그럴 법하게는 세포의 앞날에 아무런 중대한 차이도 일으키지 않을 것이다.", "본문", ""], ["This is a significant insight, as it shows that prospects are poor for a centrally directed solution to the problem of the commons coming from a state power in comparison with a local solution for which users assume personal responsibility.", "이것은 중대한 통찰인데, 공유지 문제에 대해 이용자가 개인적 책임을 지는 지역적 해결책에 비해 국가 권력에서 나오는 중앙 집중식 해결책은 전망이 어둡다는 것을 보여 주기 때문이다.", "2022-수능", ""], ["Migration is generally selective of persons who are younger, healthier, more flexible, and more willing to endure hardship in hopes of a better life relative to their prospects in their places of origin.", "이주는 일반적으로 출신지에서의 앞날에 비해 더 나은 삶을 바라며 더 젊고, 더 건강하고, 더 유연하며, 고난을 더 기꺼이 견디려는 사람들을 선별한다.", "2025-고2-교육청-6월", ""]]}, {"w": "disrupt", "ipa": "dɪsˈrʌpt", "m": "ⓥ 방해하다, 교란하다, 지장을 주다", "d": [["ⓥ", "to stop something from continuing in its usual way", "어떤 것이 평소대로 계속되지 못하게 하다"]], 은 영리한 속임수인데, 가시와 투구를 만드는 것은 에너지 면에서 비용이 많이 들고, 에너지를 아끼는 것은 생물이 생존하고 번식하는 능력에 필수적이기 때문이다.", "2023-수능", ""]]}, {"w": "neutral", "ipa": "ˈnuːtrəl", "m": "ⓐ 중립적인; 영향이 없는", "d": [["ⓐ", "not supporting either side; having no particular effect", "어느 쪽도 지지하지 않는; 특별한 영향이 없는"]], "et": "라틴어 neuter (둘 중 어느 쪽도 아닌)", "ex": "어느 쪽에도 속하지 않는 → 중립의", "g": [["유의어", "objective (객관적인), unbiased (편향되지 않은)"], ["반의어", "biased (편향된), subjective (주관적인)"]], "c": ["a neutral state (중립 상태)", "neutral and objective (중립적이고 객관적인)"], "s": [["Changes due to mistakes of the second type ― neutral changes ― may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed.", "두 번째 유형의 실수로 생긴 변화, 즉 중립적인 변화는 지속될 수도 있고 그렇지 않을 수도 있다. 변형된 세포나 그 사촌 세포들이 성공할지는 운의 문제이다.", "본문", ""], ["The media is the primary source of information about genetic advances and their applications, but it does not provide a neutral discourse.", "미디어는 유전학의 발전과 그 응용에 관한 정보의 주된 원천이지만, 중립적인 담론을 제공하지는 않는다.", "2020-평가원-9월", ""], ["This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.", "이는 고통이 사실 중립 상태를 유지하는 우리 능력의 필수 요소이며, 고통을 허용하면 결국 우리의 내부 저울이 다시 균형 상태로 재설정되기 때문이다.", "2024-고2-교육청-10월", ""]]}, {"w": "progeny", "ipa": "ˈprɑːdʒəni", "m": "ⓝ 자손, 후손", "d": [["ⓝ", "the young or descendants of a person, animal, or plant", "사람·동물·식물의 새끼나 후손"]], "et": "pro (앞으로) + gignere (낳다)", "ex": "앞으로 낳은 것 → 자손", "g": [["유의어", "offspring (자손), descendant (후손)"], ["반의어", "ancestor (조상)"]], "c": ["leave no progeny (자손을 남기지 않다)"], "s": [["But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.", "그러나 심각한 손상을 일으키는 변화는 아무 결과로도 이어지지 않는다. 그런 변화를 겪는 세포는 자손을 남기지 못하고 죽기 때문이다.", "본문", ""]]}, {"w": "repetition", "ipa": "ˌrepəˈtɪʃən", "m": "ⓝ 반복, 되풀이", "d": [["ⓝ", "the act of doing or saying something again and again", "무언가를 거듭해서 하거나 말하는 것"]], "et": "re (다시) + petere (구하다, 향하다) + -tion (명사형 어미)", "ex": "다시 구함 → 반복", "g": [["파생어", "repeat ⓥ (반복하다), repetitive ⓐ (반복적인), repeatedly ad. (반복해서)"]], "c": ["endless repetition (끝없는 반복)"], "s": [["Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "이러한 돌연변이와 자연 선택의 순환이 끝없이 반복되면서 생물은 진화한다. 즉 그것들의 유전적 명세가 바뀌어, 때로는 생물에게 환경을 더 효과적으로 이용하고, 다른 생물과의 경쟁에서 살아남고, 성공적으로 번식할 새로운 방법을 제공한다.", "본문", ""], ["Most natural habitats in the advanced nations have already been replaced with some form of artificial environment based on mass production or repetition.", "선진국의 자연 서식지 대부분은 이미 대량 생산이나 반복에 기반한 어떤 형태의 인공 환경으로 대체되었다.", "2021-평가원-9월", ""], ["That's a shame, because repetition is central to the process of rewiring our brains.", "반복은 우리 뇌의 회로를 다시 짜는 과정의 핵심이기 때문에 그것은 아쉬운 일이다.", "2021-고1-교육청-3월", ""]]}, {"w": "mutation", "ipa": "mjuːˈteɪʃən", "m": "ⓝ 돌연변이; 변화", "d": [["ⓝ", "a change in the genetic structure of a living thing", "생물의 유전적 구조에 생긴 변화"]], "et": "라틴어 mutare (바꾸다) + -ation (명사형 어미)", "ex": "바뀜 → 돌연변이", "g": [["유의어", "variation (변이), alteration (변화)"], ["관련어", "gene (유전자), genome (유전체)"]], "c": ["a favorable[harmful] mutation (유리한[해로운] 돌연변이)"], "s": [["Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "이러한 돌연변이와 자연 선택의 순환이 끝없이 반복되면서 생물은 진화한다. 즉 그것들의 유전적 명세가 바뀌어, 때로는 생물에게 환경을 더 효과적으로 이용하고, 다른 생물과의 경쟁에서 살아남고, 성공적으로 번식할 새로운 방법을 제공한다.", "본문", ""], ["Similarly most mutations have harmful consequences for the organism in which they occur, meaning that they reduce its reproductive fitness.", "마찬가지로 대부분의 돌연변이는 그것이 일어난 생물에게 해로운 결과를 가져오는데, 이는 돌연변이가 그 생물의 번식 적합도를 떨어뜨린다는 뜻이다.", "2024-수능", ""], ["Similarly, almost everyone has birthmarks, which are due to mutations that occurred as our body's cells multiplied to form skin.", "마찬가지로 거의 모든 사람에게 모반이 있는데, 그것은 우리 몸의 세포가 증식하여 피부를 형성할 때 일어난 돌연변이 때문이다.", "2024-고2-교육청-10월", ""]]}, {"w": "selection", "ipa": "sɪˈlekʃən", "m": "ⓝ 선택, 선발; 선택된 것", "d": [["ⓝ", "the process of choosing; (natural selection) the process by which organisms best suited to their environment survive", "고르는 과정; (자연 선택) 환경에 가장 잘 맞는 생물이 살아남는 과정"]], "et": "se (따로) + legere (고르다) + -tion (명사형 어미)", "ex": "따로 골라냄 → 선택", "g": [["유의어", "choice (선택)"], ["파생어", "select ⓥ (선택하다), selective ⓐ (선별적인)"]], "c": ["natural selection (자연 선택)"], "s": [["Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.", "이러한 돌연변이와 자연 선택의 순환이 끝없이 반복되면서 생물은 진화한다. 즉 그것들의 유전적 명세가 바뀌어, 때로는 생물에게 환경을 더 효과적으로 이용하고, 다른 생물과의 경쟁에서 살아남고, 성공적으로 번식할 새로운 방법을 제공한다.", "본문", ""], ["It follows that natural selection is unlikely to lead to the evolution of perfect, 'maximally fit' individuals.", "따라서 자연 선택이 완벽하고 '최대로 적합한' 개체의 진화로 이어질 가능성은 낮다.", "2024-평가원-6월", ""], ["In the absence of threat, natural selection tends to resist change.", "위협이 없을 때 자연 선택은 변화에 저항하는 경향이 있다.", "2021-평가원-6월", ""]]}, {"w": "evolve", "ipa": "ɪˈvɑːlv", "m": "ⓥ 진화하다; 발전하다", "d": [["ⓥ", "to develop gradually over a long period of time", "오랜 기간에 걸쳐 점차 발전하다"]], "et": "e(x) (밖으로) + volvere (굴리다, 말다)", "ex": "말린 것을 펼치다 → 서서히 전개되다, 진화하다", "g": [["유의어", "develop (발달하다), progress (진보하다), advance (발전하다)"], ["파생어", "evolution ⓝ (진화), evolutionary ⓐ (진화의)"]], "c": ["evolve into A (A로 진화하다)", "rapidly evolving (빠르게 발전하는)"], "s": [["Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giv 계, 교육 기관, 그리고 단체들이 그 용어를 진지하게 사용하기 시작했다.", "2020-평가원-6월", ""]]}, {"w": "essential", "ipa": "ɪˈsenʃəl", "m": "ⓐ 필수적인, 본질적인, 극히 중요한", "d": [["ⓐ", "extremely important and necessary", "극히 중요하고 필요한"], ["ⓐ", "relating to the basic nature of something", "어떤 것의 기본적 본질과 관련된"]], "et": "라틴어 essentia (본질) ← esse (존재하다)", "ex": "본질에 속하는 → 필수적인", "g": [["유의어", "necessary (필요한), vital (필수적인), crucial (중대한)"], ["반의어", "unnecessary (불필요한), optional (선택적인)"], ["파생어", "essence ⓝ (본질), essentially ad. (본질적으로)"]], "c": ["be essential to[for] A (A에 필수적이다)"], "s": [["In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.", "대조적으로 유교 문화에서는 개인을 위한 공정한 기회 균등을 추구하는 것도 중요하지만, 가족이 인간의 번영에서 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 필수적인 삶의 방식으로 여겨진다.", "본문", ""], ["There are reasons why science is not fully trusted and why healthy skepticism and critical thinking are essential.", "과학이 완전히 신뢰받지 못하는 이유와, 건전한 회의주의와 비판적 사고가 필수적인 이유가 있다.", "2025-고2-교육청-3월", ""], ["For example, the cultivators of the Himalayas and Karakoram view forests as essentially a convertible resource.", "예를 들어, 히말라야와 카라코람의 경작민들은 숲을 본질적으로 전환 가능한 자원으로 여긴다.", "2019-평가원-9월", ""]]}, {"w": "primarily", "ipa": "praɪˈmerəli", "m": "ad. 주로, 우선, 무엇보다도", "d": [["ad.", "mainly; more than anything else", "주로; 다른 무엇보다도"]], "et": "라틴어 primus (첫째의) + -ly (부사형 어미)", "ex": "첫째로 → 주로", "g": [["유의어", "mainly (주로), mostly (대개), largely (대체로)"], ["파생어", "primary ⓐ (주요한, 최초의)"]], "c": [], "s": [["Individuals are primarily understood as family members before they are regarded as state citizens.", "개인은 국가의 시민으로 여겨지기에 앞서 무엇보다도 가족 구성원으로 이해된다.", "본문", ""], ["Europe's first Homo sapiens lived primarily on large game, particularly reindeer.", "유럽 최초의 호모 사피엔스는 주로 큰 사냥감, 특히 순록을 먹고 살았다.", "2019-수능", ""], ["Thus, their observations were primarily conducted from their verandas.", "따라서 그들의 관찰은 주로 그들의 베란다에서 이루어졌다.", "2025-평가원-9월", ""]]}, {"w": "regard", "ipa": "rɪˈɡɑːrd", "m": "ⓥ (~으로) 여기다, 간주하다 ⓝ 관심, 고려; 존경", "d": [["ⓥ", "to think about someone or something in a particular way", "누군가나 무언가를 특정한 방식으로 생각하다"], ["ⓝ", "attention or consideration; respect", "관심이나 고려; 존경"]], "et": "re (다시) + garder (지켜보다)", "ex": "다시 지켜보다 → 여기다, 고려하다", "g": [["유의어", "consider (여기다), view (여기다), see (보다), respect (존경)"], ["파생어", "regarding prep. (~에 관하여), regardless ad. (상관없이)"]], "c": ["regard A as B (A를 B로 여기다)", "with regard to A (A에 관하여)", "highly regarded (높이 평가받는)"], "s": [["Individuals are primarily understood as family members before they are regarded as state citizens.", "개인은 국가의 시민으로 여겨지기에 앞서 무엇보다도 가족 구성원으로 이해된다.", "본문", ""], ["Richard Burton was a highly regarded Welsh actor of stage and screen.", "Richard Burton은 무대와 영화 모두에서 높이 평가받는 웨일스 출신 배우였다.", "2019-평가원-6월", ""], ["With regard to peer-to-peer risks such as bullying, this last element is of particular importance.", "괴롭힘 같은 또래 간 위험과 관련해서는 이 마지막 요소가 특히 중요하다.", "2018-수능", ""]]}, {"w": "possess", "ipa": "pəˈzes", "m": "ⓥ 지니다, 소유하다, 가지다", "d": [["ⓥ", "to have or own something, or to have a particular quality", "무언가를 갖거나 소유하다, 또는 특정한 성질을 지니다"]], "et": "라틴어 possidere ← potis (힘 있는) + sedere (앉다)", "ex": "주인으로 앉아 있다 → 소유하다", "g": [["유의어", "own (소유하다), have (가지다), hold (보유하다)"], ["반의어", "lack (부족하다)"], ["파생어", "possession ⓝ (소유(물))"]], "c": ["possess inherent value (고유한 가치를 지니다)"], "s": [["Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "따라서 유교주의자들에게 가족은, 설령 어떤 사회적 불평등을 초래하더라도 결코 버려져서는 안 되는 고유한 가치를 지닌다.", "본문", ""], ["As a consequence, those people, organizations, and countries that possess the highest-quality information are likely to prosper economically, socially, and politically.", "그 결과, 최고 품질의 정보를 보유한 사람, 조직, 국가가 경제적·사회적·정치적으로 번영할 가능성이 크다.", "2019-수능", ""], ["And this is exactly where modern research now stands: all researchers know so far is that apes possess mirror neurons.", "그리고 바로 이것이 현대 연구가 지금 서 있는 지점이다. 지금까지 연구자들이 아는 것은 유인원이 거울 뉴런을 지니고 있다는 것뿐이다.", "2025-고2-교육청-9월", ""]]}, {"w": "inherent", "ipa": "ɪnˈhɪrənt", "m": "ⓐ 고유한, 내재된, 타고난", "d": [["ⓐ", "existing as a natural or basic part of something", "어떤 것의 자연스럽거나 기본적인 일부로 존재하는"]], "et": "in (안에) + haerere (달라붙다)", "ex": "안에 붙어 있는 → 내재된", "g": [["유의어", "intrinsic (본질적인), innate (타고난), built-in (내재된), natural (타고난)"], ["반의어", "external (외부의), acquired (후천적인)"], ["파생어", "inherently ad. (본질적으로)"]], "c": ["inherent value (고유한 가치)"], "s": [["Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "따라서 유교주의자들에게 가족은, 설령 어떤 사회적 불평등을 초래하더라도 결코 버려져서는 안 되는 고유한 가치를 지닌다.", "본문", ""], ["Cute, baby-like features are inherently appealing, producing a nurturing response in most humans.", "귀엽고 아기 같은 특징은 본질적으로 매력적이어서 대부분의 인간에게서 보살피려는 반응을 이끌어 낸다.", "2018-평가원-6월", ""], ["You're reacting to a threat to your inherent sense of hierarchy.", "여러분은 자신의 내재된 위계 의식에 대한 위협에 반응하고 있는 것이다.", "2025-고2-교육청-9월", ""]]}, {"w": "abandon", "ipa": "əˈbændən", "m": "ⓥ 버리다, 포기하다, 단념하다", "d": [["ⓥ", "to leave someone or something, or to stop doing or supporting something", "누군가나 무언가를 떠나거나, 어떤 것을 하거나 지지하기를 그만두다"]], "et": "고대 프랑스어 a bandon (남의 통제 아래로)", "ex": "남의 손에 넘겨 버리다 → 버리다", "g": [["유의어", "give up (포기하다), desert (버리다), quit (그만두다)"], ["반의어", "keep (지키다), maintain (유지하다), pursue (추구하다)"]], "c": ["abandon one's dreams (꿈을 포기하다)"], "s": [["Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "따라서 유교주의자들에게 가족은, 설령 어떤 사회적 불평등을 초래하더라도 결코 버려져서는 안 되는 고유한 가치를 지닌다.", "본문", ""], ["This leads people to continue on paths or pursuits that should clearly be abandoned.", "이것은 사람들이 분명히 포기해야 할 길이나 일을 계속하게 만든다.", "2023-평가원-6월", ""], ["But it's better to disappoint a few people over small things, than to abandon your dreams for an empty inbox.", "그러나 텅 빈 받은편지함을 위해 꿈을 포기하는 것보다는 사소한 일로 몇 사람을 실망시키는 편이 낫다.", "2022-평가원-6월", ""]]}, {"w": "societal", "ipa": "səˈsaɪətəl", "m": "ⓐ 사회의, 사회적인", "d": [["ⓐ", "relating to society or the way it is organized", "사회 또는 사회가 조직된 방식과 관련된"]], "et": "society (사회) + -al (형용사형 어미)", "ex": "사회의", "g": [["유의어", "social (사회의), public (공공의)"], ["파생어", "society ⓝ (사회)"]], "c": ["societal issues[inequalities] (사회적 문제[불평등])"], "s": [["Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "따라서 유교주의자들에게 가족은, 설령 어떤 사회적 불평등을 초래하더라도 결코 버려져서는 안 되는 고유한 가치를 지닌다.", "본문", ""], ["Reduction or elimination of these factors may require societal action, such as public awareness and public health measures.", "이러한 요인을 줄이거나 없애려면 대중의 인식 제고나 공중 보건 조치 같은 사회적 행동이 필요할 수 있다.", "2022-수능", ""], ["To be mathematically literate means to be able to think critically about societal issues on which mathematics has bearing so as to make informed decisions about how to solve these problems.", "수학적 소양이 있다는 것은 수학과 관련된 사회적 문제에 대해 비판적으로 생각하여 그 문제를 해결하는 방법에 관해 정보에 입각한 결정을 내릴 수 있다는 뜻이다.", "2024-고2-교육청-10월", ""]]}, {"w": "inequality", "ipa": "ˌɪnɪˈkwɑːləti", "m": "ⓝ 불평등, 불균등", "d": [["ⓝ", "an unfair situation in which some people have more rights, money, or opportunities than others", "어떤 사람들이 다른 사람들보다 더 많은 권리·돈·기회를 갖는 불공정한 상황"]], "et": "in (아닌) + equality (평등)", "ex": "평등하지 않음", "g": [["유의어", "imbalance (불균형), gap (격차)"], ["반의어", "equality (평등)"]], "c": ["rising inequality (증가하는 불평등)", "societal inequalities (사회적 불평등)"], "s": [["Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.", "따라서 유교주의자들에게 가족은, 설령 어떤 사회적 불평등을 초래하더라도 결코 버려져서는 안 되는 고유한 가치를 지닌다.", "본문", ""], ["But rising inequality, itself often driven by technology, has started to put that mechanism under strain.", "그러나 그 자체가 흔히 기술에 의해 촉발되는, 증가하는 불평등이 그 메커니즘에 부담을 주기 시작했다.", "2024-고2-교육청-9월", ""], ["Technological unemployment would weaken that longstanding arrangement, encouraging an even more extreme version of inequality in which some people receive more income than others and many receive nothing at all.", "기술로 인한 실업은 그 오랜 체계를 약화시켜, 어떤 사람들은 다른 사람들보다 더 많은 소득을 얻고 많은 사람들은 아무것도 얻지 못하는, 훨씬 더 극단적인 형태의 불평등을 조장할 것이다.", "2026-평가원-6월", ""]]}, {"w": "impose", "ipa": "ɪmˈpoʊz", "m": "ⓥ (제한·세금 등을) 가하다, 부과하다; 강요하다", "d": [["ⓥ", "to introduce a rule, tax, or limit and force people to accept it", "규칙·세금·제한을 도입하여 사람들이 받아들이게 하다"]], "et": "in (위에) + ponere (놓다)", "ex": "위에 올려놓다 → 부과하다", "g": [["유의어", "enforce (시행하다), place (부과하다), force (강요하다)"], ["반의어", "remove (없애다), lift (해제하다)"], ["파생어", "imposition ⓝ (부과)"]], "c": ["impose A on B (B에게 A를 부과하다)", "impose a tariff (관세를 부과하다)"], "s": [["Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.", "자유주의 문화 같은 일부 문화는 공정한 기회 균등을 추구하면서 가족의 역할에 점점 더 많은 제한을 가하고, 교육, 의료, 그리고 사회의 다른 적극적 권리를 위한 더 평등주의적인 정부 프로그램을 시행하는 것을 택할 수도 있다.", "본문", ""], ["If you impose a high enough tariff, their jobs will indeed be protected from competition by foreign steel companies.", "충분히 높은 관세를 부과하면, 그들의 일자리는 외국 철강 회사와의 경쟁으로부터 실제로 보호될 것이다.", "2023-고2-교육청-6월", ""], ["It is difficult, if not impossible, to define the limits which reason should impose on the desire for wealth; for there is no absolute or definite amount of wealth which will satisfy a man.", "이성이 부에 대한 욕망에 가해야 할 한계를 정하는 것은 불가능하지는 않더라도 어려운데, 한 사람을 만족시킬 절대적이거나 확정된 부의 양은 없기 때문이다.", "2025-고2-교육청-6월", ""]]}, {"w": "restriction", "ipa": "rɪˈstrɪkʃən", "m": "ⓝ 제한, 규제", "d": [["ⓝ", "a rule or law that limits what people can do", "사람들이 할 수 있는 것을 제한하는 규칙이나 법"]], "et": "re (뒤로) + stringere (꽉 묶다) + -tion (명사형 어미)", "ex": "뒤로 꽉
